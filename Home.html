  <style>
    /* Reset & basics */
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #2c3e50;
    }
    a {
      color: #ecf0f1;
      text-decoration: none;
      display: block;
    }
    a:hover { text-decoration: none; }

    /* Topbar */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #007BFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 5px rgb(255, 255, 255);
      z-index: 10;
    }

    #dateTime { font-weight: bold; font-size: 16px; color: hsl(0, 0%, 98%); }

    /* Right-side top controls: bell + profile */
    .top-right-controls { display: flex; align-items: center; gap: 20px; position: relative; }

    .bell-icon {
      position: relative;
      width: 35px !important;
      height: 29px !important;
      color: gold !important;
      filter: drop-shadow(0 0 5px gold) !important;
      cursor: pointer;
      outline: none;
    }

    .bell-icon:hover, .bell-icon:focus {
      transform: scale(1.3) !important; 
      filter: drop-shadow(0 0 12px gold) !important;
      outline: none;
    }

    /* Notification badge on bell icon */
    .badge {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background: #e74c3c;
      border-radius: 50%;
      box-shadow: 0 0 6px #b33a3a;
      pointer-events: none;
      display: none; /* Hidden by default */
    }

    /* Profile */
    .profile {
      position: relative;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
    }
    .profile img {
      border-radius: 50%;
      width: 40px; height: 40px;
      margin-right: 8px;
    }
    .profile span {
      font-weight: bold;
      color: #2c3e50;
      margin-right: 5px;
    }
    .profile svg {
      width: 12px;
      height: 12px;
      fill: #2c3e50;
      transition: transform 0.3s ease;
    }
    .profile.open svg {
      transform: rotate(180deg);
    }

    /* Profile dropdown */
    #profileDropdown {
      display: none;
      position: absolute;
      top: 50px;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      min-width: 140px;
      z-index: 20;
    }
    #profileDropdown a, #profileDropdown button {
      display: block;
      width: 100%;
      padding: 10px 15px;
      text-align: left;
      border: none;
      background: none;
      color: #333;
      font-size: 14px;
      cursor: pointer;
    }
    #profileDropdown a:hover, #profileDropdown button:hover {
      background: #f0f0f0;
    }
    #profileDropdown button {
      color: #e74c3c;
    }

    /* Container */
    .container {
      display: flex;
      height: 100vh;
      padding-top: 60px; /* leave space for topbar */
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: #2c3e50;
      color: white;
      padding: 20px;
      position: fixed;
      top: 60px;
      left: -260px; /* hidden by default */
      height: calc(100% - 60px);
      border-top-right-radius: 15px;
      border-bottom-right-radius: 15px;
      box-shadow:
        inset 0 0 8px rgba(255,255,255,0.1),
        5px 0 20px rgba(0,0,0,0.3);
      transition: left 0.3s ease;
      z-index: 15;
      perspective: 800px;
    }
    .sidebar.open {
      left: 0;
    }
    .sidebar h2 {
      margin-top: 0;
      margin-bottom: 25px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
    .menu {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    .menu-item {
      margin-bottom: 14px;
      border-radius: 10px;
      background: linear-gradient(145deg, #34495e, #2c3e50);
      box-shadow:
        3px 3px 6px #22303f,
        -3px -3px 6px #3d5369;
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background 0.3s ease;
      cursor: pointer;
      transform-style: preserve-3d;
    }
    .menu-item a {
      color: #ecf0f1;
      font-weight: 600;
      padding: 12px 20px;
      display: block;
      border-radius: 10px;
      user-select: none;
      transition: color 0.3s ease;
    }
    /* 3D hover effect */
    .menu-item:hover {
      transform: translateZ(10px) translateY(-4px) rotateX(5deg);
      box-shadow:
        5px 8px 15px rgba(0,0,0,0.4),
        inset 0 0 10px rgba(255,255,255,0.2);
      background: linear-gradient(145deg, #4a6a91, #3a506e);
    }
    .menu-item:hover a {
      color: #ffd700; /* golden highlight on hover */
    }

    /* Main content */
    .main-content {
      flex: 1;
      padding: 80px 30px 30px 30px;
      margin-left: 0;
      width: 100%;
      background: #f9f9f9;
      min-height: calc(100vh - 60px);
      overflow-y: auto;
      border-top-left-radius: 20px;
      position: relative;
      transition: margin-left 0.3s ease, width 0.3s ease;
    }

    /* When sidebar is open, push main content */
    .sidebar.open ~ .main-content {
      margin-left: 250px;
      width: calc(100% - 250px);
    }

    /* Toggle button */
    .menu-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 70px;
      left: 20px;
      z-index: 25;
      color: #2c3e50;
      transition: transform 0.2s;
    }
    .menu-btn:hover {
      transform: scale(1.2);
    }
  </style>

    document.addEventListener("DOMContentLoaded", () => {
      const sidebar = document.getElementById("sidebar");

      const todoListEl = document.getElementById("todoList");
const todoDateLabel = document.getElementById("todoDateLabel");
const prevDayBtn = document.getElementById("prevDayBtn");
const nextDayBtn = document.getElementById("nextDayBtn");
const newTaskInput = document.getElementById("newTaskInput");
const addTaskBtn = document.getElementById("addTaskBtn");

let currentDate = new Date();
let currentTasks = [];

function getFormattedDate(date) {
  return date.toISOString().split("T")[0];
}

function getReadableDate(date) {
  return date.toLocaleDateString(undefined, {
    year: 'numeric', month: 'short', day: 'numeric'
  });
}

async function loadTasks(dateObj) {
  const dateKey = getFormattedDate(dateObj);
  todoDateLabel.textContent = getReadableDate(dateObj);
  todoListEl.innerHTML = "<li>Loading...</li>";

  try {
    const docRef = firebase.firestore().collection("userTasks").doc(username);
    const docSnap = await docRef.get();
    let tasks = [];

    if (docSnap.exists) {
      const data = docSnap.data();
      if (data?.tasks?.[dateKey]) {
        tasks = data.tasks[dateKey];
      }
    }

    currentTasks = tasks;
    renderTasks(tasks);
  } catch (error) {
    console.error("Error loading tasks:", error);
    todoListEl.innerHTML = "<li>Error loading tasks.</li>";
  }
}

function renderTasks(tasks) {
  if (!tasks || tasks.length === 0) {
    todoListEl.innerHTML = "<li>No tasks for this date.</li>";
    return;
  }

  todoListEl.innerHTML = "";
  tasks.forEach((task, i) => {
    const li = document.createElement("li");
    if (task.completed) li.classList.add("completed");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.completed || false;

    const taskId = `task-${i}-${task.text.replace(/\s+/g, '-')}`;
    checkbox.id = taskId;

    const label = document.createElement("label");
    label.htmlFor = taskId;
    label.textContent = task.text;
    label.style.marginLeft = "8px";
    label.style.flexGrow = "1";

    checkbox.addEventListener("change", () => {
      task.completed = checkbox.checked;
      li.classList.toggle("completed", checkbox.checked);
      saveTasks(currentDate, currentTasks);
    });

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";
    deleteBtn.className = "delete-btn";
    deleteBtn.title = "Delete this task";
    deleteBtn.style.marginLeft = "8px";
    deleteBtn.style.backgroundColor = "#e74c3c";
    deleteBtn.style.color = "white";
    deleteBtn.style.border = "none";
    deleteBtn.style.borderRadius = "6px";
    deleteBtn.style.cursor = "pointer";
    deleteBtn.style.padding = "2px 6px";
    deleteBtn.style.fontSize = "0.9rem";

    deleteBtn.addEventListener("click", () => {
      if (confirm("Are you sure you want to delete this task?")) {
        currentTasks.splice(i, 1);
        saveTasks(currentDate, currentTasks).then(() => {
          renderTasks(currentTasks);
        });
      }
    });

    li.style.display = "flex";
    li.style.alignItems = "center";
    li.style.marginBottom = "10px";

    li.appendChild(checkbox);
    li.appendChild(label);
    li.appendChild(deleteBtn);

    todoListEl.appendChild(li);
  });
}

async function saveTasks(dateObj, tasks) {
  const dateKey = getFormattedDate(dateObj);
  try {
    const docRef = firebase.firestore().collection("userTasks").doc(username);
    await docRef.set({
      tasks: {
        [dateKey]: tasks
      }
    }, { merge: true });
  } catch (error) {
    console.error("Error saving tasks:", error);
  }
}

prevDayBtn.addEventListener("click", () => {
  currentDate.setDate(currentDate.getDate() - 1);
  loadTasks(currentDate);
});

nextDayBtn.addEventListener("click", () => {
  currentDate.setDate(currentDate.getDate() + 1);
  loadTasks(currentDate);
});

addTaskBtn.addEventListener("click", () => {
  const text = newTaskInput.value.trim();
  if (!text) return;
  currentTasks.push({ text, completed: false });
  saveTasks(currentDate, currentTasks).then(() => {
    renderTasks(currentTasks);
    newTaskInput.value = "";
    newTaskInput.focus();
  });
});

newTaskInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    addTaskBtn.click();
  }
});

// Greet user
document.getElementById("userGreetingName").textContent = username || "User";

// Load tasks on page load
loadTasks(currentDate);

      const profileToggle = document.getElementById("profileToggle");
      const profileDropdown = document.getElementById(profileDropdownId);
      const logoutBtn = document.getElementById("logoutBtn");
      const bellIcon = profileDiv.querySelector(".bell-icon");
      const notificationBadge = profileDiv.querySelector(".badge");

      // Function to update badge visibility
      function updateNotificationBadge() {
        const hasNew = localStorage.getItem('hasNewNotifications') === 'true';
        if (hasNew) {
          notificationBadge.style.display = 'block';
        } else {
          notificationBadge.style.display = 'none';
        }
      }
      updateNotificationBadge();

      // Toggle dropdown on profile click
      profileToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = profileDropdown.style.display === "block";
        if (isOpen) {
          profileDropdown.style.display = "none";
          profileDiv.classList.remove("open");
        } else {
          profileDropdown.style.display = "block";
          profileDiv.classList.add("open");
          sidebar.classList.remove("open"); // close sidebar if open
        }
      });

      // Open notification.html on bell click or keyboard activation
      function openNotifications() {
        window.open("notification.html", "_blank");
        // Clear new notifications flag and hide badge
        localStorage.setItem('hasNewNotifications', 'false');
        updateNotificationBadge();
      }
      bellIcon.addEventListener("click", openNotifications);
      bellIcon.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
          e.preventDefault();
          openNotifications();
        }
      });

      // Logout
      logoutBtn.addEventListener("click", () => {
        sessionStorage.clear();
        window.location.href = "index.html";
      });

      // Sidebar toggle button handler
      function bindToggleSidebar() {
        const toggleBtn = document.getElementById("toggleSidebar");
        if (toggleBtn) {
          toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            sidebar.classList.toggle("open");
            profileDropdown.style.display = "none";
            profileDiv.classList.remove("open");
          });
        }
      }
      bindToggleSidebar();

      // Close sidebar and dropdown on outside click
      document.addEventListener("click", (e) => {
        if (!sidebar.contains(e.target)) {
          sidebar.classList.remove("open");
        }
        if (!profileDiv.contains(e.target)) {

      });

        if (e.key === "Escape") {

          profileDiv.classList.remove("open");

      });
    });
