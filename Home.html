<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager Dashboard</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #2c3e50;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 60px; background: #007BFF;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 10;
    }
    #dateTime { font-weight: bold; font-size: 16px; color: #fafafa; }
    .profile { position: relative; cursor: pointer; display: flex; align-items: center; }
    .profile img { border-radius: 50%; width: 40px; height: 40px; margin-right: 8px; }
    .profile span { font-weight: bold; color: #fafafa; margin-right: 5px; }
    #profileDropdown {
      display: none; position: absolute; top: 50px; right: 0;
      background: white; border: 1px solid #ccc; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); min-width: 140px; z-index: 20;
    }
    #profileDropdown a, #profileDropdown button {
      display: block; width: 100%;
      padding: 10px 15px; text-align: left;
      border: none; background: none; color: #333; font-size: 14px; cursor: pointer;
    }
    #profileDropdown button { color: #e74c3c; }
    a:hover, button:hover { background: #f0f0f0; }
    .container { display: flex; height: 100vh; padding-top: 60px; }
    .sidebar {
      width: 200px; background: #2c3e50; color: white;
      padding: 20px; min-height: calc(100% - 60px);
    }
    .sidebar ul { list-style: none; padding: 0; margin: 0; }
    .sidebar .menu-item { margin-bottom: 12px; }
    .sidebar .menu-item a {
      color: #ecf0f1; text-decoration: none; font-weight: 600;
      padding: 10px; display: block; border-radius: 6px;
    }
    .sidebar .menu-item a:hover { background: #34495e; }
    .main-content {
      flex: 1; padding: 80px 30px 30px 30px;
      background: #f9f9f9; overflow-y: auto; position: relative;
    }
    .todo-panel {
      background: white; border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      padding: 20px; max-width: 400px; margin-left: auto;
    }
    .todo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .todo-header button {
      background: #007BFF; color: white; border: none; padding: 6px 12px;
      border-radius: 6px; cursor: pointer;
    }
    .add-task { display: flex; gap: 8px; margin-bottom: 12px; }
    .add-task input {
      flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
    }
    .add-task button {
      background: #007BFF; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    }
    .todo-list { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; }
    .todo-list li {
      display: flex; align-items: center; margin-bottom: 8px;
    }
    .todo-list li.completed label {
      text-decoration: line-through; color: #999;
    }
    .todo-list label {
      margin-left: 8px; flex: 1; cursor: pointer;
    }
    .delete-btn {
      margin-left: 8px; background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div id="dateTime">Loading date/time...</div>
    <div class="profile" id="profileDiv">
      <img src="https://i.pravatar.cc/40" alt="User" /><span id="profileName"></span>
      <div id="profileDropdown">
        <a href="Change Password.html">Settings</a>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>

  <div class="container">
    <nav class="sidebar">
      <ul>
        <li class="menu-item"><a href="Home.html">Dashboard</a></li>
        <li class="menu-item"><a href="Users.html">Users</a></li>
        <li class="menu-item"><a href="tasks.html">All Tasks</a></li>
        <li class="menu-item"><a href="Chart.html">Charts</a></li>
        <li class="menu-item"><a href="AssignTask.html">Assign Task</a></li>
        <li class="menu-item"><a href="Generate Report.html">Report</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <h1>Welcome, <span id="userGreeting"></span>!</h1>
      <div class="todo-panel">
        <div class="todo-header">
          <button id="prevDayBtn">&lt; Prev</button>
          <div id="todoDateLabel">--</div>
          <button id="nextDayBtn">Next &gt;</button>
        </div>

        <div class="add-task">
          <input type="text" id="newTaskInput" placeholder="Add new task..." />
          <button id="addTaskBtn">Add</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>
      </div>
    </main>
  </div>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const username = sessionStorage.getItem("username") || "Guest";
    document.getElementById("userGreeting").textContent = username;
    document.getElementById("profileName").textContent = username;

    // Profile dropdown
    const profileDiv = document.getElementById("profileDiv");
    const dropdown = document.getElementById("profileDropdown");
    profileDiv.addEventListener("click", () => {
      dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
    });
    document.addEventListener("click", e => {
      if (!profileDiv.contains(e.target)) dropdown.style.display = "none";
    });
    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "index.html";
    });

    // Date/time display
    function updateClock() {
      const now = new Date();
      document.getElementById("dateTime").textContent = now.toLocaleString();
    }
    updateClock();
    setInterval(updateClock, 1000);

    // To-Do logic
    const todoListEl = document.getElementById("todoList");
    const todoDateLabel = document.getElementById("todoDateLabel");
    const prevBtn = document.getElementById("prevDayBtn");
    const nextBtn = document.getElementById("nextDayBtn");
    const input = document.getElementById("newTaskInput");
    const addBtn = document.getElementById("addTaskBtn");

    let currentDate = new Date();
    let tasks = [];

    function fmt(date) {
      return date.toISOString().split("T")[0];
    }
    function rdt(date) {
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    async function loadTasks() {
      const key = fmt(currentDate);
      todoDateLabel.textContent = rdt(currentDate);
      todoListEl.innerHTML = "<li>Loading...</li>";
      try {
        const snap = await db.collection("userTasks").doc(username).get();
        const data = snap.exists ? snap.data() : {};
        tasks = (data.tasks && data.tasks[key]) || [];
        renderTasks();
      } catch {
        todoListEl.innerHTML = "<li>Error loading tasks.</li>";
      }
    }

    function renderTasks() {
      if (tasks.length === 0) {
        todoListEl.innerHTML = "<li>No tasks for this date.</li>";
        return;
      }
      todoListEl.innerHTML = "";
      tasks.forEach((t, i) => {
        const li = document.createElement("li");
        if (t.completed) li.classList.add("completed");
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = t.completed;
        cb.onchange = () => { t.completed = cb.checked; saveTasks(); };
        const lbl = document.createElement("label");
        lbl.textContent = t.text; lbl.style.marginLeft = "8px";
        const del = document.createElement("button");
        del.textContent = "Delete"; del.className = "delete-btn";
        del.onclick = () => {
          if (confirm("Delete this task?")) { tasks.splice(i, 1); saveTasks(); }
        };
        li.append(cb, lbl, del);
        todoListEl.append(li);
      });
    }

    async function saveTasks() {
      const key = fmt(currentDate);
      const payload = { tasks: { [key]: tasks } };
      await db.collection("userTasks").doc(username).set(payload, { merge: true });
      renderTasks();
    }

    prevBtn.onclick = () => { currentDate.setDate(currentDate.getDate() - 1); loadTasks(); };
    nextBtn.onclick = () => { currentDate.setDate(currentDate.getDate() + 1); loadTasks(); };
    addBtn.onclick = () => {
      const txt = input.value.trim();
      if (!txt) return;
      tasks.push({ text: txt, completed: false });
      input.value = "";
      saveTasks();
    };
    input.addEventListener("keypress", e => { if (e.key === "Enter") addBtn.click(); });

    loadTasks();
  </script>
</body>
</html>
