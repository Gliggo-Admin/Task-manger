<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager Dashboard</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #2c3e50;
    }
    a {
      color: #ecf0f1;
      text-decoration: none;
      display: block;
    }
    a:hover { text-decoration: none; }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #007BFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 5px rgb(255, 255, 255);
      z-index: 10;
    }
    #dateTime { font-weight: bold; font-size: 16px; color: #fff; }

    .container {
      display: flex;
      height: 100vh;
      padding-top: 60px;
    }

    .sidebar {
      width: 250px;
      background: #2c3e50;
      color: white;
      padding: 20px;
      position: fixed;
      top: 60px;
      left: -260px;
      height: calc(100% - 60px);
      border-top-right-radius: 15px;
      border-bottom-right-radius: 15px;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.1), 5px 0 20px rgba(0,0,0,0.3);
      transition: left 0.3s ease;
      z-index: 15;
    }
    .sidebar.open {
      left: 0;
    }
    .sidebar h2 {
      margin-top: 0;
      margin-bottom: 25px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    .menu {
      list-style: none;
      padding-left: 0;
      margin: 0 0 20px 0;
    }
    .menu-item {
      margin-bottom: 14px;
    }
    .menu-item a {
      color: #ecf0f1;
      font-weight: 600;
      padding: 12px 20px;
      display: block;
      border-radius: 10px;
      background: #34495e;
      transition: background 0.3s ease;
    }
    .menu-item a:hover {
      background: #3a506e;
      color: #ffd700;
    }

    /* To-Do Panel */
    .todo-panel {
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .todo-panel h3 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #f1c40f;
    }
    #todoList {
      list-style: none;
      padding-left: 0;
      max-height: 200px;
      overflow-y: auto;
    }
    #todoList li {
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      color: #ecf0f1;
    }
    #todoList input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.1);
      cursor: pointer;
    }

    .main-content {
      flex: 1;
      padding: 80px 30px 30px 30px;
      margin-left: 0;
      width: 100%;
      min-height: calc(100vh - 60px);
      transition: margin-left 0.3s ease, width 0.3s ease;
    }

    .sidebar.open ~ .main-content {
      margin-left: 250px;
      width: calc(100% - 250px);
    }

    .menu-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      color: white;
    }
  </style>

  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const sidebar = document.getElementById("sidebar");
      const toggleBtn = document.getElementById("toggleSidebar");
      const dateTime = document.getElementById("dateTime");

      // Date and time
      setInterval(() => {
        const now = new Date();
        dateTime.textContent = now.toLocaleString();
      }, 1000);

      // Toggle sidebar
      toggleBtn.addEventListener("click", () => {
        sidebar.classList.toggle("open");
      });

      // Save todo task checkbox status (optional)
      document.querySelectorAll('#todoList input[type="checkbox"]').forEach((checkbox, index) => {
        const saved = localStorage.getItem(`todo_${index}`);
        checkbox.checked = saved === 'true';

        checkbox.addEventListener('change', () => {
          localStorage.setItem(`todo_${index}`, checkbox.checked);
        });
      });
    });
  </script>
</head>

<body>
  <div class="topbar">
    <button id="toggleSidebar" class="menu-btn">&#9776;</button>
    <div id="dateTime">Loading date/time...</div>
  </div>

  <div class="container">
    <aside class="sidebar" id="sidebar">
      <h2>Menu</h2>
      <ul class="menu">
        <li class="menu-item"><a href="Home.html">Dashboard</a></li>
        <li class="menu-item"><a href="Users.html">Users</a></li>
        <li class="menu-item"><a href="tasks.html">All Task</a></li>
        <li class="menu-item"><a href="Chart.html">Chart View</a></li>
        <li class="menu-item"><a href="AssignTask.html">Assign Task</a></li>
        <li class="menu-item"><a href="Genrate Report.html">Report</a></li>
      </ul>

      <!-- To-Do Tasks -->
      <div class="todo-panel">
        <h3>To-Do Tasks</h3>
        <ul id="todoList">
          <li><input type="checkbox"> Complete login UI</li>
          <li><input type="checkbox"> Review user feedback</li>
          <li><input type="checkbox"> Schedule meeting</li>
          <li><input type="checkbox"> Update report</li>
        </ul>
      </div>
    </aside>

    <main class="main-content" id="main">
      <h1>Welcome to the Task Manager</h1>
      <p>Your productivity dashboard.</p>
      <a href="Home.html" id="homeLink">Home</a>
    </main>
  </div>
</body>
</html>
