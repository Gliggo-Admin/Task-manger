<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager Dashboard</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    /* Reset & base */
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f8;
      color: #2c3e50;
    }

    /* Topbar */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #007BFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    /* Hamburger menu toggle for sidebar */
    .menu-toggle {
      font-size: 26px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      display: none;
    }

    #dateTime {
      font-weight: bold;
      font-size: 16px;
      color: #ffffff;
      user-select: none;
    }

    /* Profile area */
    .profile {
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      color: #ffffff;
      user-select: none;
    }

    .avatar {
      background-color: #ffffff;
      color: #007BFF;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      margin-right: 8px;
    }

    .dropdown-arrow {
      margin-left: 4px;
      font-size: 12px;
      user-select: none;
    }

    #profileDropdown {
      display: none;
      position: absolute;
      top: 50px;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      min-width: 150px;
      z-index: 200;
    }

    #profileDropdown a,
    #profileDropdown button {
      display: block;
      width: 100%;
      padding: 10px 15px;
      text-align: left;
      border: none;
      background: none;
      color: #333;
      font-size: 14px;
      cursor: pointer;
      outline: none;
      user-select: none;
    }

    #profileDropdown button {
      color: #e74c3c;
    }

    #profileDropdown a:hover,
    #profileDropdown button:hover {
      background: #f0f0f0;
    }

    /* Container */
    .container {
      display: flex;
      height: 100vh;
      padding-top: 60px;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #2c3e50;
      color: white;
      padding: 20px 0;
      transition: transform 0.3s ease;
      user-select: none;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar .menu-item a {
      color: #ecf0f1;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      display: block;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .sidebar .menu-item a:hover {
      background: #34495e;
    }

    .sidebar.hidden {
      transform: translateX(-100%);
      position: fixed;
      top: 60px;
      left: 0;
      height: calc(100% - 60px);
      z-index: 99;
      box-shadow: 2px 0 5px rgba(0,0,0,0.2);
    }

    /* Main content */
    .main-content {
      flex: 1;
      padding: 30px 40px 30px 40px;
      background: #f9f9f9;
      overflow-y: auto;
      user-select: none;
    }

    .main-content h1 {
      margin-top: 0;
      margin-bottom: 30px;
      font-weight: 700;
      color: #34495e;
    }

    /* To-Do Panel */
    .todo-panel {
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      padding: 25px;
      max-width: 450px;
      margin-left: auto;
    }

    .todo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .todo-header button {
      background: #007BFF;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      user-select: none;
      transition: background 0.2s ease;
    }

    .todo-header button:hover {
      background: #0056b3;
    }

    #todoDateLabel {
      font-weight: 700;
      font-size: 18px;
      color: #2c3e50;
    }

    .add-task {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .add-task input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .add-task input:focus {
      border-color: #007BFF;
    }

    .add-task button {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      user-select: none;
      transition: background 0.2s ease;
    }

    .add-task button:hover {
      background: #1e7e34;
    }

    .todo-list {
      list-style: none;
      padding: 0;
      max-height: 350px;
      overflow-y: auto;
    }

    .todo-list li {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      user-select: none;
    }

    .todo-list li.completed label {
      text-decoration: line-through;
      color: #999;
    }

    .todo-list input[type="checkbox"] {
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .todo-list label {
      margin-left: 10px;
      flex: 1;
      cursor: pointer;
      font-size: 15px;
      color: #2c3e50;
    }

    .delete-btn {
      margin-left: 10px;
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      user-select: none;
      transition: background 0.2s ease;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }

      .sidebar {
        position: fixed;
        top: 60px;
        left: 0;
        height: calc(100% - 60px);
        z-index: 99;
        box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        background: #2c3e50;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .sidebar.visible {
        transform: translateX(0);
      }

      .main-content {
        padding: 20px 20px 20px 20px;
        max-width: 100%;
        margin-left: 0;
      }

      .todo-panel {
        max-width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <button class="menu-toggle" id="menuToggleBtn" aria-label="Toggle menu">☰</button>
    <div id="dateTime">Loading date/time...</div>
    <div class="profile" id="profileDiv" tabindex="0" aria-haspopup="true" aria-expanded="false" aria-controls="profileDropdown">
      <div class="avatar" id="profileAvatar">U</div>
      <div class="dropdown-arrow">▼</div>
      <div id="profileDropdown" role="menu" aria-hidden="true">
        <a href="Change Password.html" role="menuitem" tabindex="-1">Settings</a>
        <button id="logoutBtn" role="menuitem" tabindex="-1">Logout</button>
      </div>
    </div>
  </div>

  <div class="container">
    <nav class="sidebar" id="sidebar" aria-label="Main navigation">
      <ul>
        <li class="menu-item"><a href="Home.html">Dashboard</a></li>
        <li class="menu-item"><a href="Users.html">Users</a></li>
        <li class="menu-item"><a href="tasks.html">All Tasks</a></li>
        <li class="menu-item"><a href="Chart.html">Charts</a></li>
        <li class="menu-item"><a href="AssignTask.html">Assign Task</a></li>
        <li class="menu-item"><a href="Generate Report.html">Report</a></li>
      </ul>
    </nav>

    <main class="main-content" role="main" tabindex="-1">
      <h1>Welcome, <span id="userGreeting">User</span>!</h1>

      <div class="todo-panel" aria-label="To-do task manager panel">
        <div class="todo-header">
          <button id="prevDayBtn" aria-label="Previous day">&lt; Prev</button>
          <div id="todoDateLabel" aria-live="polite" aria-atomic="true">--</div>
          <button id="nextDayBtn" aria-label="Next day">Next &gt;</button>
        </div>

        <div class="add-task">
          <input type="text" id="newTaskInput" placeholder="Add new task..." aria-label="New task input" />
          <button id="addTaskBtn" aria-label="Add task">Add</button>
        </div>

        <ul class="todo-list" id="todoList" aria-live="polite" aria-atomic="true" aria-relevant="all"></ul>
      </div>
    </main>
  </div>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Elements
    const sidebar = document.getElementById('sidebar');
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const profileDiv = document.getElementById("profileDiv");
    const profileDropdown = document.getElementById("profileDropdown");
    const logoutBtn = document.getElementById("logoutBtn");
    const profileAvatar = document.getElementById("profileAvatar");
    const userGreeting = document.getElementById("userGreeting");
    const dateTimeEl = document.getElementById("dateTime");

    // Sidebar toggle logic
    menuToggleBtn.addEventListener('click', () => {
      if (sidebar.classList.contains('visible')) {
        sidebar.classList.remove('visible');
        sidebar.classList.add('hidden');
      } else {
        sidebar.classList.add('visible');
        sidebar.classList.remove('hidden');
      }
    });

    // Close sidebar clicking outside on small screens
    document.addEventListener('click', (e) => {
      if (!sidebar.contains(e.target) && e.target !== menuToggleBtn) {
        if (sidebar.classList.contains('visible')) {
          sidebar.classList.remove('visible');
          sidebar.classList.add('hidden');
        }
      }
    });

    // Get username from sessionStorage or default "User"
    const username = sessionStorage.getItem("username") || "User";
    userGreeting.textContent = username;

    // Show first letter in avatar uppercase
    profileAvatar.textContent = username.charAt(0).toUpperCase();

    // Profile dropdown toggle
    profileDiv.addEventListener("click", (e) => {
      e.stopPropagation();
      const isVisible = profileDropdown.style.display === "block";
      if (isVisible) {
        profileDropdown.style.display = "none";
        profileDiv.setAttribute("aria-expanded", "false");
        profileDropdown.setAttribute("aria-hidden", "true");
      } else {
        profileDropdown.style.display = "block";
        profileDiv.setAttribute("aria-expanded", "true");
        profileDropdown.setAttribute("aria-hidden", "false");
      }
    });

    // Hide dropdown clicking outside
    document.addEventListener("click", () => {
      profileDropdown.style.display = "none";
      profileDiv.setAttribute("aria-expanded", "false");
      profileDropdown.setAttribute("aria-hidden", "true");
    });

    // Logout button logic
    logoutBtn.addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "index.html";
    });

    // Live date/time in topbar
    function updateClock() {
      const now = new Date();
      dateTimeEl.textContent = now.toLocaleString();
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Task Manager Elements
    const todoListEl = document.getElementById("todoList");
    const todoDateLabel = document.getElementById("todoDateLabel");
    const prevBtn = document.getElementById("prevDayBtn");
    const nextBtn = document.getElementById("nextDayBtn");
    const input = document.getElementById("newTaskInput");
    const addBtn = document.getElementById("addTaskBtn");

    let currentDate = new Date();
    let tasks = [];

    // Format date as YYYY-MM-DD for key
    function fmt(date) {
      return date.toISOString().split("T")[0];
    }
    // Format date for display, e.g. Aug 7, 2025
    function rdt(date) {
      return date.toLocaleDateString(undefined, {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    // Load tasks from Firestore for current user & date
    async function loadTasks() {
      const key = fmt(currentDate);
      todoDateLabel.textContent = rdt(currentDate);
      todoListEl.innerHTML = "<li>Loading tasks...</li>";

      try {
        const docRef = db.collection("userTasks").doc(username);
        const docSnap = await docRef.get();

        if (docSnap.exists) {
          const data = docSnap.data();
          tasks = (data.tasks && data.tasks[key]) || [];
        } else {
          tasks = [];
        }
        renderTasks();
      } catch (error) {
        todoListEl.innerHTML = "<li>Error loading tasks.</li>";
        console.error("Firestore error:", error);
      }
    }

    // Render task list in UI
    function renderTasks() {
      if (tasks.length === 0) {
        todoListEl.innerHTML = "<li>No tasks for this date.</li>";
        return;
      }
      todoListEl.innerHTML = "";

      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("completed");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = task.completed;
        cb.setAttribute("aria-label", "Mark task complete");
        cb.onchange = () => {
          task.completed = cb.checked;
          saveTasks();
        };

        const lbl = document.createElement("label");
        lbl.textContent = task.text;
        lbl.style.marginLeft = "10px";

        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.className = "delete-btn";
        delBtn.setAttribute("aria-label", "Delete task");
        delBtn.onclick = () => {
          if (confirm("Delete this task?")) {
            tasks.splice(index, 1);
            saveTasks();
          }
        };

        li.append(cb, lbl, delBtn);
        todoListEl.appendChild(li);
      });
    }

    // Save tasks back to Firestore
    async function saveTasks() {
      const key = fmt(currentDate);
      try {
        await db.collection("userTasks").doc(username).set({
          tasks: {
            [key]: tasks
          }
        }, { merge: true });
        renderTasks();
      } catch (error) {
        console.error("Failed to save tasks:", error);
      }
    }

    // Date navigation buttons
    prevBtn.onclick = () => {
      currentDate.setDate(currentDate.getDate() - 1);
      loadTasks();
    };
    nextBtn.onclick = () => {
      currentDate.setDate(currentDate.getDate() + 1);
      loadTasks();
    };

    // Add new task button
    addBtn.onclick = () => {
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, completed: false });
      input.value = "";
      saveTasks();
    };

    // Allow adding task with Enter key
    input.addEventListener("keypress", e => {
      if (e.key === "Enter") addBtn.click();
    });

    // Initial load
    loadTasks();
  </script>

</body>
</html>
