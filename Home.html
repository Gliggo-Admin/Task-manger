<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager Dashboard</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #2c3e50;
      overflow-x: hidden;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 60px; background: #007BFF;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 1001;
    }
    #dateTime { font-weight: bold; font-size: 16px; color: #fafafa; display: flex; align-items: center; }

    #sidebarToggle {
      font-size: 24px;
      color: #fafafa;
      background: none;
      border: none;
      cursor: pointer;
      margin-right: 10px;
      display: block;
    }

    .profile {
      position: relative; cursor: pointer; display: flex; align-items: center;
      width: 40px; height: 40px;
      background: #0056b3; border-radius: 50%;
      color: white; font-weight: bold; font-size: 20px;
      justify-content: center; text-transform: uppercase;
    }

    #profileDropdown {
      display: none; position: absolute; top: 50px; right: 0;
      background: white; border: 1px solid #ccc; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); min-width: 140px; z-index: 1002;
    }
    #profileDropdown a, #profileDropdown button {
      display: block; width: 100%;
      padding: 10px 15px; text-align: left;
      border: none; background: none; color: #333; font-size: 14px; cursor: pointer;
    }
    #profileDropdown button { color: #e74c3c; }
    a:hover, button:hover { background: #f0f0f0; }

    .sidebar {
      position: fixed; top: 60px; left: 0;
      width: 220px; height: calc(100% - 60px);
      background: #2c3e50; color: white;
      padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 1000;
    }
    .sidebar.visible { transform: translateX(0); }
    .sidebar ul { list-style: none; padding: 0; margin: 0; }
    .sidebar .menu-item { margin-bottom: 12px; }
    .sidebar .menu-item a {
      color: #ecf0f1; text-decoration: none; font-weight: 600;
      padding: 10px; display: block; border-radius: 6px;
    }
    .sidebar .menu-item a:hover { background: #34495e; }

    .main-content {
      margin-top: 60px; padding: 30px;
      transition: margin-left 0.3s ease; margin-left: 0;
    }
    .main-content.shifted { margin-left: 220px; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .dashboard-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .attendance-status {
      text-align: center;
      padding: 15px;
    }
    
    .attendance-status h3 {
      margin-top: 0;
      color: #2c3e50;
    }
    
    .status-indicator {
      font-size: 24px;
      font-weight: bold;
      margin: 15px 0;
    }
    
    .status-present {
      color: #27ae60;
    }
    
    .status-absent {
      color: #e74c3c;
    }
    
    .status-break {
      color: #f39c12;
    }
    
    .attendance-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .attendance-btn {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-login {
      background: #27ae60;
      color: white;
    }
    
    .btn-logout {
      background: #e74c3c;
      color: white;
    }
    
    .btn-break {
      background: #f39c12;
      color: white;
    }
    
    .btn-resume {
      background: #3498db;
      color: white;
    }
    
    .attendance-btn:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }
    
    .today-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }
    
    .summary-item {
      text-align: center;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    
    .summary-value {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    .todo-panel {
      background: white; border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      padding: 20px; max-width: 400px; margin-left: auto;
    }
    .todo-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .todo-header button {
      background: #007BFF; color: white; border: none;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
    }
    .add-task {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .add-task input {
      flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
    }
    .add-task button {
      background: #007BFF; color: white; border: none;
      padding: 8px 16px; border-radius: 6px; cursor: pointer;
    }
    .todo-list {
      list-style: none; padding: 0; max-height: 300px; overflow-y: auto;
    }
    .todo-list li {
      display: flex; align-items: center; margin-bottom: 8px;
    }
    .todo-list li.completed label {
      text-decoration: line-through; color: #999;
    }
    .todo-list label {
      margin-left: 8px; flex: 1; cursor: pointer;
    }
    .delete-btn {
      margin-left: 8px; background: #e74c3c;
      color: white; border: none; padding: 4px 8px;
      border-radius: 4px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
    <div id="dateTime">Loading date/time...</div>
    <div class="profile" id="profileDiv" tabindex="0" aria-haspopup="true" aria-expanded="false" title="User menu">
      <div id="profileInitial" aria-label="User initial" role="img"></div>
      <div id="profileDropdown" role="menu" aria-label="Profile options">
        <a href="Change Password.html" role="menuitem">Settings</a>
        <a href="Attendance.html" role="menuitem">Attendance</a>
        <button id="logoutBtn" role="menuitem">Logout</button>
      </div>
    </div>
  </div>

  <nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <ul>
      <li class="menu-item"><a href="Home.html">Dashboard</a></li>
      <li class="menu-item"><a href="Users.html">Users</a></li>
      <li class="menu-item"><a href="tasks.html">All Tasks</a></li>
      <li class="menu-item"><a href="Attendance.html">Attendance</a></li>
      <li class="menu-item"><a href="Chart.html">Charts</a></li>
      <li class="menu-item"><a href="AssignTask.html">Assign Task</a></li>
      <li class="menu-item"><a href="Genrate Report.html">Report</a></li>
    </ul>
  </nav>

  <main class="main-content" id="mainContent">
    <h1>Welcome, <span id="userGreeting"></span>!</h1>
    
    <div class="dashboard-grid">
      <div class="dashboard-card attendance-status">
        <h3>Today's Attendance</h3>
        <div id="attendanceStatus" class="status-indicator status-absent">Not Logged In</div>
        
        <div class="attendance-actions">
          <button id="loginBtn" class="attendance-btn btn-login">Login</button>
          <button id="logoutBtnAttendance" class="attendance-btn btn-logout" disabled>Logout</button>
          <button id="breakBtn" class="attendance-btn btn-break" disabled>Break Start</button>
          <button id="resumeBtn" class="attendance-btn btn-resume" disabled>Break End</button>
        </div>
        
        <div class="today-summary">
          <div class="summary-item">
            <div>Work Hours</div>
            <div id="workHours" class="summary-value">0h 0m</div>
          </div>
          <div class="summary-item">
            <div>Break Time</div>
            <div id="breakTime" class="summary-value">0h 0m</div>
          </div>
        </div>
      </div>
      
      <div class="todo-panel">
        <div class="todo-header">
          <button id="prevDayBtn">&lt; Prev</button>
          <div id="todoDateLabel">--</div>
          <button id="nextDayBtn">Next &gt;</button>
        </div>

        <div class="add-task">
          <input type="text" id="newTaskInput" placeholder="Add new task..." />
          <button id="addTaskBtn">Add</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const username = sessionStorage.getItem("username") || "Guest";
    document.getElementById("userGreeting").textContent = username;
    document.getElementById("profileInitial").textContent = username[0]?.toUpperCase() || "?";

    const profileDiv = document.getElementById("profileDiv");
    const dropdown = document.getElementById("profileDropdown");
    profileDiv.addEventListener("click", (e) => {
      e.stopPropagation();
      const isOpen = dropdown.style.display === "block";
      dropdown.style.display = isOpen ? "none" : "block";
      profileDiv.setAttribute('aria-expanded', !isOpen);
    });
    document.addEventListener("click", () => {
      dropdown.style.display = "none";
      profileDiv.setAttribute('aria-expanded', 'false');
    });
    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "index.html";
    });

    function updateClock() {
      document.getElementById("dateTime").textContent = new Date().toLocaleString();
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Attendance functionality
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtnAttendance = document.getElementById("logoutBtnAttendance");
    const breakBtn = document.getElementById("breakBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const attendanceStatus = document.getElementById("attendanceStatus");
    const workHoursEl = document.getElementById("workHours");
    const breakTimeEl = document.getElementById("breakTime");
    
    let todayAttendance = {
      loginTime: null,
      logoutTime: null,
      breaks: [],
      currentBreak: null
    };
    
    // Load today's attendance
    async function loadTodayAttendance() {
      const today = new Date().toISOString().split('T')[0];
      try {
        const doc = await db.collection("attendance")
          .doc(username)
          .collection("records")
          .doc(today)
          .get();
          
        if (doc.exists) {
          todayAttendance = doc.data();
          updateAttendanceUI();
        }
      } catch (error) {
        console.error("Error loading attendance:", error);
      }
    }
    
    function updateAttendanceUI() {
      const now = new Date();
      
      // Update status
      if (todayAttendance.logoutTime) {
        attendanceStatus.textContent = "Logged Out";
        attendanceStatus.className = "status-indicator status-absent";
        loginBtn.disabled = false;
        logoutBtnAttendance.disabled = true;
        breakBtn.disabled = true;
        resumeBtn.disabled = true;
      } else if (todayAttendance.currentBreak) {
        attendanceStatus.textContent = "On Break";
        attendanceStatus.className = "status-indicator status-break";
        loginBtn.disabled = true;
        logoutBtnAttendance.disabled = true;
        breakBtn.disabled = true;
        resumeBtn.disabled = false;
      } else if (todayAttendance.loginTime) {
        attendanceStatus.textContent = "Logged In";
        attendanceStatus.className = "status-indicator status-present";
        loginBtn.disabled = true;
        logoutBtnAttendance.disabled = false;
        breakBtn.disabled = false;
        resumeBtn.disabled = true;
      } else {
        attendanceStatus.textContent = "Not Logged In";
        attendanceStatus.className = "status-indicator status-absent";
        loginBtn.disabled = false;
        logoutBtnAttendance.disabled = true;
        breakBtn.disabled = true;
        resumeBtn.disabled = true;
      }
      
      // Calculate and display work hours
      if (todayAttendance.loginTime) {
        const loginTime = new Date(todayAttendance.loginTime);
        const endTime = todayAttendance.logoutTime ? new Date(todayAttendance.logoutTime) : now;
        
        // Subtract break times
        let totalBreakMs = 0;
        todayAttendance.breaks.forEach(breakPeriod => {
          if (breakPeriod.start && breakPeriod.end) {
            totalBreakMs += new Date(breakPeriod.end) - new Date(breakPeriod.start);
          } else if (breakPeriod.start && todayAttendance.currentBreak) {
            totalBreakMs += now - new Date(breakPeriod.start);
          }
        });
        
        const workMs = (endTime - loginTime) - totalBreakMs;
        const workHours = Math.floor(workMs / 3600000);
        const workMinutes = Math.floor((workMs % 3600000) / 60000);
        
        workHoursEl.textContent = `${workHours}h ${workMinutes}m`;
        
        // Calculate and display break time
        const breakHours = Math.floor(totalBreakMs / 3600000);
        const breakMinutes = Math.floor((totalBreakMs % 3600000) / 60000);
        breakTimeEl.textContent = `${breakHours}h ${breakMinutes}m`;
      }
    }
    
    // Login button handler
    loginBtn.addEventListener("click", async () => {
      const now = new Date();
      todayAttendance.loginTime = now.toISOString();
      
      try {
        const today = now.toISOString().split('T')[0];
        await db.collection("attendance")
          .doc(username)
          .collection("records")
          .doc(today)
          .set(todayAttendance);
          
        updateAttendanceUI();
      } catch (error) {
        console.error("Error saving login:", error);
        alert("Failed to log in. Please try again.");
      }
    });
    
    // Logout button handler
    logoutBtnAttendance.addEventListener("click", async () => {
      const now = new Date();
      todayAttendance.logoutTime = now.toISOString();
      
      try {
        const today = now.toISOString().split('T')[0];
        await db.collection("attendance")
          .doc(username)
          .collection("records")
          .doc(today)
          .set(todayAttendance);
          
        updateAttendanceUI();
      } catch (error) {
        console.error("Error saving logout:", error);
        alert("Failed to log out. Please try again.");
      }
    });
    
    // Break button handler
    breakBtn.addEventListener("click", async () => {
      const now = new Date();
      todayAttendance.currentBreak = {
        start: now.toISOString()
      };
      todayAttendance.breaks.push(todayAttendance.currentBreak);
      
      try {
        const today = now.toISOString().split('T')[0];
        await db.collection("attendance")
          .doc(username)
          .collection("records")
          .doc(today)
          .set(todayAttendance);
          
        updateAttendanceUI();
      } catch (error) {
        console.error("Error saving break:", error);
        alert("Failed to start break. Please try again.");
      }
    });
    
    // Resume button handler
    resumeBtn.addEventListener("click", async () => {
      const now = new Date();
      todayAttendance.currentBreak.end = now.toISOString();
      todayAttendance.currentBreak = null;
      
      try {
        const today = now.toISOString().split('T')[0];
        await db.collection("attendance")
          .doc(username)
          .collection("records")
          .doc(today)
          .set(todayAttendance);
          
        updateAttendanceUI();
      } catch (error) {
        console.error("Error saving resume:", error);
        alert("Failed to end break. Please try again.");
      }
    });
    
    // To-do list functionality
    const todoListEl = document.getElementById("todoList");
    const todoDateLabel = document.getElementById("todoDateLabel");
    const prevBtn = document.getElementById("prevDayBtn");
    const nextBtn = document.getElementById("nextDayBtn");
    const input = document.getElementById("newTaskInput");
    const addBtn = document.getElementById("addTaskBtn");

    let currentDate = new Date();
    let currentTasks = [];

    function fmt(date) {
      return date.toISOString().split("T")[0];
    }
    function rdt(date) {
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    async function loadTasks() {
      const key = fmt(currentDate);
      todoDateLabel.textContent = rdt(currentDate);
      todoListEl.innerHTML = "<li>Loading...</li>";
      try {
        const snap = await db.collection("userTasks").doc(username).get();
        const data = snap.exists ? snap.data() : {};
        currentTasks = (data.tasks && data.tasks[key]) || [];
        renderTasks();
      } catch {
        todoListEl.innerHTML = "<li>Error loading tasks.</li>";
      }
    }

    function renderTasks() {
      if (currentTasks.length === 0) {
        todoListEl.innerHTML = "<li>No tasks for this date.</li>";
        return;
      }
      todoListEl.innerHTML = "";
      currentTasks.forEach((task, i) => {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("completed");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = task.completed;
        const id = `task-${i}-${task.text.replace(/\s+/g, '-')}`;
        cb.id = id;

        cb.addEventListener("change", () => {
          task.completed = cb.checked;
          li.classList.toggle("completed", cb.checked);
          saveTasks();
        });

        const lbl = document.createElement("label");
        lbl.textContent = task.text;
        lbl.htmlFor = id;

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.className = "delete-btn";
        del.onclick = () => {
          if (confirm("Delete this task?")) {
            currentTasks.splice(i, 1);
            saveTasks();
          }
        };

        li.append(cb, lbl, del);
        todoListEl.appendChild(li);
      });
    }

    async function saveTasks() {
      const key = fmt(currentDate);
      const payload = { tasks: { [key]: currentTasks } };
      await db.collection("userTasks").doc(username).set(payload, { merge: true });
      renderTasks();
    }

    prevBtn.onclick = () => { currentDate.setDate(currentDate.getDate() - 1); loadTasks(); };
    nextBtn.onclick = () => { currentDate.setDate(currentDate.getDate() + 1); loadTasks(); };
    addBtn.onclick = () => {
      const txt = input.value.trim();
      if (!txt) return;
      currentTasks.push({ text: txt, completed: false });
      input.value = "";
      saveTasks();
    };
    input.addEventListener("keypress", e => { if (e.key === "Enter") addBtn.click(); });

    // Sidebar functionality
    const sidebarToggle = document.getElementById("sidebarToggle");
    const sidebar = document.getElementById("sidebar");
    const mainContent = document.getElementById("mainContent");

    sidebarToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const isVisible = sidebar.classList.contains("visible");
      sidebar.classList.toggle("visible");
      mainContent.classList.toggle("shifted");
    });

    document.addEventListener("click", (e) => {
      if (
        sidebar.classList.contains("visible") &&
        !sidebar.contains(e.target) &&
        e.target !== sidebarToggle
      ) {
        sidebar.classList.remove("visible");
        mainContent.classList.remove("shifted");
      }
    });

    // Initialize
    loadTodayAttendance();
    loadTasks();
  </script>
</body>
</html>
