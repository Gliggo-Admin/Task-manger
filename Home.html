<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager Dashboard</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #2c3e50;
      overflow-x: hidden;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 60px; background: #007BFF;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 1001;
    }
    #dateTime { font-weight: bold; font-size: 16px; color: #fafafa; }
    
    /* Hamburger toggle button */
    #sidebarToggle {
      font-size: 24px;
      color: #fafafa;
      background: none;
      border: none;
      cursor: pointer;
      margin-right: 10px;
      display: none; /* only show on small screens */
    }

    /* Profile area */
    .profile {
      position: relative; cursor: pointer; display: flex; align-items: center;
      user-select: none;
    }
    .profile img {
      border-radius: 50%; width: 40px; height: 40px; margin-right: 8px;
      object-fit: cover;
      background: #ccc;
    }
    .profile span {
      font-weight: bold; color: #fafafa; margin-right: 5px;
    }
    #profileDropdown {
      display: none; position: absolute; top: 50px; right: 0;
      background: white; border: 1px solid #ccc; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); min-width: 140px; z-index: 1002;
    }
    #profileDropdown a, #profileDropdown button {
      display: block; width: 100%;
      padding: 10px 15px; text-align: left;
      border: none; background: none; color: #333; font-size: 14px; cursor: pointer;
    }
    #profileDropdown button { color: #e74c3c; }
    a:hover, button:hover { background: #f0f0f0; }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 60px;
      left: 0;
      width: 220px;
      height: calc(100% - 60px);
      background: #2c3e50;
      color: white;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 1000;
    }
    .sidebar.visible {
      transform: translateX(0);
    }
    .sidebar ul {
      list-style: none; padding: 0; margin: 0;
    }
    .sidebar .menu-item {
      margin-bottom: 12px;
    }
    .sidebar .menu-item a {
      color: #ecf0f1; text-decoration: none; font-weight: 600;
      padding: 10px; display: block; border-radius: 6px;
    }
    .sidebar .menu-item a:hover {
      background: #34495e;
    }

    /* Main content */
    .main-content {
      margin-top: 60px;
      padding: 30px;
      transition: margin-left 0.3s ease;
      margin-left: 0;
    }
    /* When sidebar visible, push main content */
    .main-content.shifted {
      margin-left: 220px;
    }

    /* Todo panel styles */
    .todo-panel {
      background: white; border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      padding: 20px; max-width: 400px; margin-left: auto;
    }
    .todo-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .todo-header button {
      background: #007BFF; color: white; border: none; padding: 6px 12px;
      border-radius: 6px; cursor: pointer;
    }
    .add-task {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .add-task input {
      flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
    }
    .add-task button {
      background: #007BFF; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    }
    .todo-list {
      list-style: none; padding: 0; max-height: 300px; overflow-y: auto;
    }
    .todo-list li {
      display: flex; align-items: center; margin-bottom: 8px;
    }
    .todo-list li.completed label {
      text-decoration: line-through; color: #999;
    }
    .todo-list label {
      margin-left: 8px; flex: 1; cursor: pointer;
    }
    .delete-btn {
      margin-left: 8px; background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;
    }

    /* Responsive: Show hamburger on small */
    @media (max-width: 768px) {
      #sidebarToggle {
        display: block;
      }
      .sidebar {
        top: 60px;
        height: calc(100% - 60px);
        width: 220px;
        padding: 20px;
        /* transform handled by JS toggle */
      }
      .main-content {
        margin-left: 0 !important;
      }
      .main-content.shifted {
        margin-left: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
    <div id="dateTime">Loading date/time...</div>
    <div class="profile" id="profileDiv" tabindex="0" aria-haspopup="true" aria-expanded="false">
      <img src="https://i.pravatar.cc/40" alt="User" />
      <span id="profileName"></span>
      <div id="profileDropdown" role="menu" aria-label="Profile options">
        <a href="Change Password.html" role="menuitem">Settings</a>
        <button id="logoutBtn" role="menuitem">Logout</button>
      </div>
    </div>
  </div>

  <nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <ul>
      <li class="menu-item"><a href="Home.html">Dashboard</a></li>
      <li class="menu-item"><a href="Users.html">Users</a></li>
      <li class="menu-item"><a href="tasks.html">All Tasks</a></li>
      <li class="menu-item"><a href="Chart.html">Charts</a></li>
      <li class="menu-item"><a href="AssignTask.html">Assign Task</a></li>
      <li class="menu-item"><a href="Generate Report.html">Report</a></li>
    </ul>
  </nav>

  <main class="main-content" id="mainContent">
    <h1>Welcome, <span id="userGreeting"></span>!</h1>
    <div class="todo-panel">
      <div class="todo-header">
        <button id="prevDayBtn">&lt; Prev</button>
        <div id="todoDateLabel">--</div>
        <button id="nextDayBtn">Next &gt;</button>
      </div>

      <div class="add-task">
        <input type="text" id="newTaskInput" placeholder="Add new task..." />
        <button id="addTaskBtn">Add</button>
      </div>

      <ul class="todo-list" id="todoList"></ul>
    </div>
  </main>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const username = sessionStorage.getItem("username") || "Guest";
    document.getElementById("userGreeting").textContent = username;
    document.getElementById("profileName").textContent = username;

    // Profile dropdown
    const profileDiv = document.getElementById("profileDiv");
    const dropdown = document.getElementById("profileDropdown");
    profileDiv.addEventListener("click", () => {
      const isOpen = dropdown.style.display === "block";
      dropdown.style.display = isOpen ? "none" : "block";
      profileDiv.setAttribute('aria-expanded', !isOpen);
    });
    document.addEventListener("click", e => {
      if (!profileDiv.contains(e.target)) {
        dropdown.style.display = "none";
        profileDiv.setAttribute('aria-expanded', 'false');
      }
    });
    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "index.html";
    });

    // Date/time display
    function updateClock() {
      const now = new Date();
      document.getElementById("dateTime").textContent = now.toLocaleString();
    }
    updateClock();
    setInterval(updateClock, 1000);

    // To-Do logic
    const todoListEl = document.getElementById("todoList");
    const todoDateLabel = document.getElementById("todoDateLabel");
    const prevBtn = document.getElementById("prevDayBtn");
    const nextBtn = document.getElementById("nextDayBtn");
    const input = document.getElementById("newTaskInput");
    const addBtn = document.getElementById("addTaskBtn");

    let currentDate = new Date();
    let tasks = [];

    function fmt(date) {
      return date.toISOString().split("T")[0];
    }
    function rdt(date) {
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    async function loadTasks() {
      const key = fmt(currentDate);
      todoDateLabel.textContent = rdt(currentDate);
      todoListEl.innerHTML = "<li>Loading...</li>";
      try {
        const snap = await db.collection("userTasks").doc(username).get();
        const data = snap.exists ? snap.data() : {};
        tasks = (data.tasks && data.tasks[key]) || [];
        renderTasks();
      } catch {
        todoListEl.innerHTML = "<li>Error loading tasks.</li>";
      }
    }

    function renderTasks() {
      if (tasks.length === 0) {
        todoListEl.innerHTML = "<li>No tasks for this date.</li>";
        return;
      }
      todoListEl.innerHTML = "";
      tasks.forEach((t, i) => {
        const li = document.createElement("li");
        if (t.completed) li.classList.add("completed");
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = t.completed;
        cb.onchange = () => { t.completed = cb.checked; saveTasks(); };
        const lbl = document.createElement("label");
        lbl.textContent = t.text; lbl.style.marginLeft = "8px";
        const del = document.createElement("button");
        del.textContent = "Delete"; del.className = "delete-btn";
        del.onclick = () => {
          if (confirm("Delete this task?")) { tasks.splice(i, 1); saveTasks(); }
        };
        li.append(cb, lbl, del);
        todoListEl.append(li);
      });
    }

    async function saveTasks() {
      const key = fmt(currentDate);
      const payload = { tasks: { [key]: tasks } };
      await db.collection("userTasks").doc(username).set(payload, { merge: true });
      renderTasks();
    }

    prevBtn.onclick = () => { currentDate.setDate(currentDate.getDate() - 1); loadTasks(); };
    nextBtn.onclick = () => { currentDate.setDate(currentDate.getDate() + 1); loadTasks(); };
    addBtn.onclick = () => {
      const txt = input.value.trim();
      if (!txt) return;
      tasks.push({ text: txt, completed: false });
      input.value = "";
      saveTasks();
    };
    input.addEventListener("keypress", e => { if (e.key === "Enter") addBtn.click(); });

    loadTasks();

    // Sidebar toggle logic
    const sidebarToggle = document.getElementById("sidebarToggle");
    const sidebar = document.getElementById("sidebar");
    const mainContent = document.getElementById("mainContent");

    sidebarToggle.addEventListener("click", () => {
      const isVisible = sidebar.classList.contains("visible");
      if (isVisible) {
        sidebar.classList.remove("visible");
        mainContent.classList.remove("shifted");
      } else {
        sidebar.classList.add("visible");
        mainContent.classList.add("shifted");
      }
    });

    // Close sidebar if click outside on small screens
    document.addEventListener("click", (e) => {
      if (
        sidebar.classList.contains("visible") &&
        !sidebar.contains(e.target) &&
        e.target !== sidebarToggle
      ) {
        sidebar.classList.remove("visible");
        mainContent.classList.remove("shifted");
      }
    });
  </script>
</body>
</html>
