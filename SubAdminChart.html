<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Dashboard Charts - SubAdminChart</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Chart.js & Firebase SDKs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    h1 img {
      vertical-align: middle;
      height: 30px;
      margin-right: 8px;
    }
    .button-container {
      text-align: center;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }
    .home-button {
      padding: 12px 24px;
      background-color: #3498db;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .home-button:hover {
      background-color: #1c5980;
    }
    select, input[type=date] {
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      min-width: 140px;
    }
    button.load-btn {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background-color: #27ae60;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button.load-btn:hover {
      background-color: #1e8449;
    }
    #loading {
      text-align: center;
      margin-top: 50px;
      font-size: 18px;
      color: #666;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(450px,1fr));
      gap: 30px;
      max-width: 960px;
      margin: 0 auto 40px;
    }
    .chart-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 480px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }
    label {
      font-weight: 600;
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <h1>
    <img src="https://cdn-icons-png.flaticon.com/512/3645/3645709.png" alt="icon" />
    Task Dashboard Charts
  </h1>

  <div class="button-container">
    <button class="home-button" onclick="window.location.href='Sub Admin Dashboard.html'">🏠 Home</button>

    <label for="dateRangeSelect">Date Range:</label>
    <select id="dateRangeSelect" onchange="onDateRangeChange()">
      <option value="thisMonth">This Month</option>
      <option value="prevMonth">Previous Month</option>
      <option value="custom">Custom Range</option>
    </select>

    <label for="startDate" id="startDateLabel" style="display:none;">From:</label>
    <input type="date" id="startDate" style="display:none;" max="" />

    <label for="endDate" id="endDateLabel" style="display:none;">To:</label>
    <input type="date" id="endDate" style="display:none;" max="" />

    <label for="ownerFilter">Owner:</label>
    <select id="ownerFilter">
      <option value="all">All Owners</option>
    </select>

    <button class="load-btn" onclick="loadFilteredData()">Load</button>
  </div>

  <div id="loading">Loading tasks...</div>

  <div class="chart-grid" id="chartsContainer" style="display:none;">
    <div class="chart-card"><canvas id="statusChart"></canvas></div>
    <div class="chart-card"><canvas id="companyChart"></canvas></div>
    <div class="chart-card"><canvas id="monthlyCompanyChart"></canvas></div>
    <div class="chart-card"><canvas id="avgDurationChart"></canvas></div>
  </div>

  <script>
    // Firebase config - replace with your own if needed
    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allTasks = [];
    let filteredTasks = [];
    const charts = {};

    // Color palette - distinct colors for charts
    const colors = [
      '#1abc9c', '#3498db', '#e67e22', '#9b59b6',
      '#e74c3c', '#f1c40f', '#34495e', '#2ecc71'
    ];

    // Utility to convert hex to rgba with alpha
    function rgba(hex, alpha = 1) {
      const bigint = parseInt(hex.slice(1), 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r},${g},${b},${alpha})`;
    }

    // Initialize date inputs max to today
    const todayStr = new Date().toISOString().slice(0, 10);
    document.getElementById('startDate').max = todayStr;
    document.getElementById('endDate').max = todayStr;

    // Show/hide custom date inputs based on dropdown
    function onDateRangeChange() {
      const val = document.getElementById('dateRangeSelect').value;
      const showCustom = val === 'custom';

      document.getElementById('startDate').style.display = showCustom ? 'inline-block' : 'none';
      document.getElementById('endDate').style.display = showCustom ? 'inline-block' : 'none';
      document.getElementById('startDateLabel').style.display = showCustom ? 'inline-block' : 'none';
      document.getElementById('endDateLabel').style.display = showCustom ? 'inline-block' : 'none';

      if (!showCustom) {
        // Clear custom dates on change to non-custom
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
      }
    }

    // Parse Firestore timestamp or ISO date string
    function parseDate(value) {
      if (!value) return null;
      if (value.seconds) {
        return new Date(value.seconds * 1000);
      }
      const d = new Date(value);
      return isNaN(d) ? null : d;
    }

    // Filter tasks by date range and owner filter
    function filterTasks() {
      const dateRange = document.getElementById('dateRangeSelect').value;
      let startDate, endDate;

      if (dateRange === 'thisMonth') {
        const now = new Date();
        startDate = new Date(now.getFullYear(), now.getMonth(), 1);
        endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
      } else if (dateRange === 'prevMonth') {
        const now = new Date();
        startDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        endDate = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59, 999);
      } else if (dateRange === 'custom') {
        const s = document.getElementById('startDate').value;
        const e = document.getElementById('endDate').value;
        if (!s || !e) {
          alert("Please select both start and end dates for custom range.");
          return null;
        }
        startDate = new Date(s);
        endDate = new Date(e);
        endDate.setHours(23,59,59,999);
        if (endDate < startDate) {
          alert("End date cannot be before start date.");
          return null;
        }
      }

      // Owner filter
      const owner = document.getElementById('ownerFilter').value;

      return allTasks.filter(task => {
        const d = parseDate(task.startDate);
        if (!d) return false;
        if (d < startDate || d > endDate) return false;

        if (owner !== 'all' && task.owner !== owner) return false;
        return true;
      });
    }

    // Count tasks by field (for pie/bar charts)
    function countByField(tasks, field) {
      return tasks.reduce((acc, t) => {
        const val = t[field] || 'Unknown';
        acc[val] = (acc[val] || 0) + 1;
        return acc;
      }, {});
    }

    // Group tasks by month label (MMM YYYY)
    function groupTasksByMonth(tasks) {
      const monthMap = {};
      tasks.forEach(task => {
        const d = parseDate(task.startDate);
        if (!d) return;
        const key = d.toLocaleString('default', { month: 'short', year: 'numeric' });
        monthMap[key] = (monthMap[key] || 0) + 1;
      });
      // Sort keys chronologically
      const sortedKeys = Object.keys(monthMap).sort((a,b) => new Date(a) - new Date(b));
      const data = sortedKeys.map(k => monthMap[k]);
      return { labels: sortedKeys, datasets: [{ label: 'Tasks Started', data, backgroundColor: rgba(colors[1], 0.6), borderColor: colors[1], borderWidth: 1, fill: false, tension: 0.3 }]};
    }

    // Average duration by company in days
    function avgDurationByCompany(tasks) {
      const durMap = {};
      const countMap = {};
      tasks.forEach(t => {
        const s = parseDate(t.startDate);
        const e = parseDate(t.endDate);
        if (!s || !e || e < s) return;
        const dur = (e - s) / (1000*60*60*24);
        const comp = t.company || 'Unknown';
        durMap[comp] = (durMap[comp] || 0) + dur;
        countMap[comp] = (countMap[comp] || 0) + 1;
      });
      const labels = Object.keys(durMap);
      const data = labels.map(l => +(durMap[l]/countMap[l]).toFixed(1));

      return {
        labels,
        datasets: [{
          label: 'Avg Duration (Days)',
          data,
          backgroundColor: labels.map((_,i) => rgba(colors[i % colors.length], 0.7)),
          borderColor: labels.map((_,i) => colors[i % colors.length]),
          borderWidth: 1
        }]
      };
    }

    // Tasks by month AND company (for multi-line)
    function tasksByMonthAndCompany(tasks) {
      const companies = [...new Set(tasks.map(t => t.company || 'Unknown'))];
      const monthSet = new Set();
      const dataMap = {};

      tasks.forEach(t => {
        const d = parseDate(t.startDate);
        if (!d) return;
        const monthKey = d.toLocaleString('default', { month: 'short', year: 'numeric' });
        monthSet.add(monthKey);
      });

      const months = Array.from(monthSet).sort((a,b) => new Date(a) - new Date(b));

      companies.forEach(comp => {
        dataMap[comp] = months.map(() => 0);
      });

      tasks.forEach(t => {
        const d = parseDate(t.startDate);
        if (!d) return;
        const monthKey = d.toLocaleString('default', { month: 'short', year: 'numeric' });
        const comp = t.company || 'Unknown';
        const mIndex = months.indexOf(monthKey);
        if (mIndex >= 0) {
          dataMap[comp][mIndex]++;
        }
      });

      const datasets = companies.map((comp,i) => ({
        label: comp,
        data: dataMap[comp],
        borderColor: colors[i % colors.length],
        backgroundColor: rgba(colors[i % colors.length], 0.3),
        fill: false,
        tension: 0.3,
        borderWidth: 2,
        pointRadius: 3,
      }));

      return {
        labels: months,
        datasets
      };
    }

    // Update or create a chart by id
    function updateOrCreateChart(id, title, dataObj, type='bar') {
      const ctx = document.getElementById(id).getContext('2d');

      let labels, datasets;

      if (dataObj.labels && dataObj.datasets) {
        labels = dataObj.labels;
        datasets = dataObj.datasets;
      } else {
        labels = Object.keys(dataObj);
        datasets = [{
          label: title,
          data: labels.map(l => dataObj[l]),
          backgroundColor: labels.map((_, i) => rgba(colors[i % colors.length], 0.7)),
          borderColor: labels.map((_, i) => colors[i % colors.length]),
          borderWidth: 1,
          fill: type === 'line' ? false : true,
          tension: 0.3,
        }];
      }

      if (charts[id]) {
        charts[id].data.labels = labels;
        charts[id].data.datasets = datasets;
        charts[id].options.plugins.title.text = title;
        charts[id].update();
      } else {
        charts[id] = new Chart(ctx, {
          type,
          data: { labels, datasets },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'bottom' },
              title: { display: true, text: title },
            },
            scales: {
              y: {
                beginAtZero: true,
                precision: 0,
              },
            },
          },
        });
      }
    }

    // Update Monthly Tasks by Company chart (line)
    function updateMonthlyCompanyChart() {
      const ctx = document.getElementById('monthlyCompanyChart').getContext('2d');
      const chartData = tasksByMonthAndCompany(filteredTasks);

      if (charts.monthlyCompanyChart) charts.monthlyCompanyChart.destroy();

      charts.monthlyCompanyChart = new Chart(ctx, {
        type: 'line',
        data: chartData,
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' },
            title: { display: true, text: 'Monthly Tasks by Company' },
          },
          scales: {
            y: { beginAtZero: true, precision: 0 },
          },
        }
      });
    }

    // Update all charts
    function updateCharts() {
      updateOrCreateChart('statusChart', 'Task Status Distribution', countByField(filteredTasks, 'status'), 'pie');
      updateOrCreateChart('companyChart', 'Tasks by Company', countByField(filteredTasks, 'company'), 'bar');
      updateMonthlyCompanyChart();
      updateOrCreateChart('avgDurationChart', 'Avg Task Duration (Days) by Company', avgDurationByCompany(filteredTasks), 'bar');
    }

    // Populate Owner filter dropdown
    function populateOwnerFilter() {
      const ownerSet = new Set(allTasks.map(t => t.owner).filter(o => o));
      const ownerSelect = document.getElementById('ownerFilter');

      ownerSet.forEach(owner => {
        const option = document.createElement('option');
        option.value = owner;
        option.textContent = owner;
        ownerSelect.appendChild(option);
      });
    }

    // Load and filter tasks, then update charts
    function loadFilteredData() {
      const filtered = filterTasks();
      if (filtered === null) return; // validation error
      filteredTasks = filtered;

      if (filteredTasks.length === 0) {
        alert("No tasks found for selected filters.");
      }

      updateCharts();
    }

    // Fetch all tasks from Firestore
    async function fetchTasks() {
      try {
        const snapshot = await db.collection('tasks').get();
        allTasks = snapshot.docs.map(doc => doc.data());
        populateOwnerFilter();

        // Default filteredTasks = all tasks from this month
        document.getElementById('dateRangeSelect').value = 'thisMonth';
        onDateRangeChange();
        filteredTasks = filterTasks() || allTasks;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('chartsContainer').style.display = 'grid';

        updateCharts();
      } catch (error) {
        document.getElementById('loading').textContent = 'Error loading tasks: ' + error.message;
        console.error("Error fetching tasks:", error);
      }
    }

    fetchTasks();
  </script>

</body>
</html>
