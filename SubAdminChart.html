<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Charts</title>

  <!-- Firebase & Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .home-btn {
      display: block;
      width: 200px;
      margin: 0 auto 30px auto;
      padding: 12px 24px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      text-align: center;
      text-decoration: none;
    }

    .home-btn:hover {
      background-color: #1c5980;
    }

    .chart-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .chart-card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 45%;
      min-height: 400px;
    }

    canvas {
      width: 100% !important;
      height: 350px !important;
    }

    @media (max-width: 768px) {
      .chart-card {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <h1>Task Dashboard Charts</h1>

  <!-- ✅ Home Button -->
  <a href="Sub Admin Dashboard.html" class="home-btn">🏠 Home</a>

  <!-- Charts -->
  <div class="chart-container">
    <div class="chart-card"><canvas id="statusChart"></canvas></div>
    <div class="chart-card"><canvas id="ownerChart"></canvas></div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function countByField(tasks, field) {
      const counts = {};
      tasks.forEach(t => {
        const val = t[field] || 'Unknown';
        counts[val] = (counts[val] || 0) + 1;
      });
      return counts;
    }

    function formatPie(obj) {
      const labels = Object.keys(obj);
      const data = Object.values(obj);
      return {
        labels,
        datasets: [{
          label: 'Count',
          data,
          backgroundColor: labels.map((_, i) =>
            `hsl(${(i * 360) / labels.length}, 70%, 60%)`)
        }]
      };
    }

    function createChart(ctxId, type, data, title) {
      const ctx = document.getElementById(ctxId).getContext('2d');
      new Chart(ctx, {
        type,
        data,
        options: {
          plugins: {
            title: {
              display: true,
              text: title
            }
          }
        }
      });
    }

    function loadTasks() {
      db.collection('tasks').get()
        .then(snapshot => {
          const tasks = snapshot.docs.map(doc => doc.data());

          const statusCounts = countByField(tasks, 'Status');
          const ownerCounts = countByField(tasks, 'Owner');

          createChart('statusChart', 'pie', formatPie(statusCounts), 'Task Status');
          createChart('ownerChart', 'pie', formatPie(ownerCounts), 'Task Owner');
        })
        .catch(err => {
          console.error("Error loading tasks:", err);
        });
    }

    document.addEventListener("DOMContentLoaded", loadTasks);
  </script>

</body>
</html>
