<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Dashboard Charts</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Chart.js & Firebase -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    /* Header */
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    h1 img {
      vertical-align: middle;
      height: 30px;
      margin-right: 8px;
    }

    /* Buttons & Filter */
    .button-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .home-button {
      padding: 12px 24px;
      background-color: #3498db;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-right: 10px;
    }

    .home-button:hover {
      background-color: #1c5980;
    }

    .filter-select {
      padding: 10px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    /* Chart Grid */
    .chart-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
    }

    .chart-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: calc(50% - 24px);
      max-width: 600px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .chart-card canvas {
      flex-grow: 1;
    }

    @media (max-width: 900px) {
      .chart-card {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>
    <img src="https://cdn-icons-png.flaticon.com/512/3645/3645709.png" alt="icon">
    Task Dashboard Charts
  </h1>

  <div class="button-container">
    <button class="home-button" onclick="window.location.href='Sub Admin Dashboard.html'">
      🏠 Home
    </button>

    <!-- Company Filter Dropdown -->
    <select id="companyFilter" class="filter-select" onchange="filterByCompany()">
      <option value="all">All Companies</option>
      <!-- Options will be populated by JavaScript -->
    </select>
  </div>

  <!-- Chart Grid Layout -->
  <div class="chart-grid">
    <div class="chart-card"><canvas id="statusChart"></canvas></div>
    <div class="chart-card"><canvas id="ownerChart"></canvas></div>
    <div class="chart-card"><canvas id="typeChart"></canvas></div>
    <div class="chart-card"><canvas id="assignedByChart"></canvas></div>
    <div class="chart-card"><canvas id="monthlyChart"></canvas></div>
    <div class="chart-card"><canvas id="avgWorkChart"></canvas></div>
    <div class="chart-card"><canvas id="avgPauseChart"></canvas></div>
    <div class="chart-card"><canvas id="completeTimelineChart"></canvas></div>
    <div class="chart-card"><canvas id="companyChart"></canvas></div>
    <div class="chart-card"><canvas id="avgDurationChart"></canvas></div>
    <div class="chart-card"><canvas id="avgDurationOwnerChart"></canvas></div>
    <div class="chart-card"><canvas id="radarChart"></canvas></div>
    <div class="chart-card"><canvas id="bubbleChart"></canvas></div>
  </div>

  <!-- Chart logic -->
  <script src="chart.js"></script>

</body>
</html>
