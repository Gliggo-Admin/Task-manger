    async function loadAllTasks() {
      const snap = await db.collection("tasks")
        .where("Status", "in", ["Not Started", "In Progress", "Pending"])
        .get();
      const arr = [];
      snap.forEach(doc => arr.push({ id: doc.id, ...doc.data() }));
      return arr;
    }

    let myTasks = [], otherTasks = [];

    // Function to display tasks depending on tab
    function showTab(tab) {
      document.getElementById("tab‑my").classList.toggle("active‑tab", tab === 'my');
      document.getElementById("tab‑other").classList.toggle("active‑tab", tab === 'other');
      taskBody.innerHTML = '';
      renderTasks(tab === 'my' ? myTasks : otherTasks);
    }

    auth.onAuthStateChanged(async user => {
      if (!user) {
        // If not authenticated, fall back to showing all tasks in "Other Tasks"
        const all = await loadAllTasks();
        otherTasks = all;
        document.getElementById("tab‑my").style.display = 'none';
        document.getElementById("tab‑other").innerText = 'All Tasks';
        showTab('other');
        return;
      }

      const uid = user.uid;

      // Query "My Tasks"
      const mySnap = await db.collection("tasks")
        .where("Owner", "==", uid)
        .where("Status", "in", ["Not Started", "In Progress", "Pending"])
        .get();
      myTasks = mySnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      // Query "Other Tasks"
      const otherSnap = await db.collection("tasks")
        .where("Status", "in", ["Not Started", "In Progress", "Pending"])
        .get();
      otherTasks = otherSnap.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(task => task.Owner !== uid);

      if (myTasks.length) {
        document.getElementById("tab‑my").style.display = 'inline-block';
        document.getElementById("tab‑other").innerText = 'Other Tasks';
        showTab('my');
      } else {
        document.getElementById("tab‑my").style.display = 'none';
        document.getElementById("tab‑other").innerText = 'All Tasks';
        otherTasks = otherTasks.concat(myTasks); // if any edge cases
        showTab('other');
      }
    });

    // Add click events for tabs
    document.getElementById("tab‑my").onclick = () => showTab('my');
    document.getElementById("tab‑other").onclick = () => showTab('other');

    // Initial loading state
    window.onload = () => {
      taskBody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Loading tasks...</td></tr>`;
