<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Current Task</title>
  <style>
    /* Your existing CSS unchanged */
    /* ... */
  </style>
</head>
<body>
  <button class="close-btn" onclick="window.history.back()">Back</button>
  <h2>Apple Task Details</h2>

  <div id="view-buttons">
    <button id="btn-table" class="active">Table View</button>
    <button id="btn-kanban">Kanban View</button>
    <button id="btn-grouped">Grouped View</button>
  </div>

  <!-- Table View -->
  <table class="task-table" id="table-view">
    <thead>
      <tr>
        <th>SINO</th><th>Company</th><th>Task</th><th>Due Date</th><th>Status</th><th>Owner</th><th>Work Hours</th>
      </tr>
    </thead>
    <tbody id="task-body"></tbody>
  </table>

  <!-- Kanban View -->
  <div id="kanban-view"></div>

  <!-- Grouped View -->
  <div id="grouped-view"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    // Initialize Firebase
    firebase.initializeApp({
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    });
    const db = firebase.firestore();

    // Elements
    const taskBody = document.getElementById("task-body");
    const tableView = document.getElementById("table-view");
    const kanbanView = document.getElementById("kanban-view");
    const groupedView = document.getElementById("grouped-view");
    const btnTable = document.getElementById("btn-table");
    const btnKanban = document.getElementById("btn-kanban");
    const btnGrouped = document.getElementById("btn-grouped");

    let allTasks = []; // Store all loaded tasks globally

    // Status labels & classes for styles
    const statusLabels = {
      "not-started": {label:"Not Started", class:"not-started"},
      "in-progress": {label:"In Progress", class:"in-progress"},
      "pending": {label:"Pending", class:"pending"},
      "complete": {label:"Complete", class:"complete"}
    };

    const now = () => firebase.firestore.Timestamp.now();

    // Format milliseconds to hh:mm:ss
    function formatMs(ms) {
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600),
            m = Math.floor((s % 3600) / 60),
            sec = s % 60;
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    // Calculate work/pause durations from sessions
    function calcTimeDetails(sessions = []) {
      let totalWorkMs = 0, totalPauseMs = 0, pauseCount = 0, lastEnd = null;
      if (Array.isArray(sessions)) {
        sessions.forEach(sess => {
          const startMs = sess.start?.toDate().getTime(),
                endMs = sess.end?.toDate().getTime();
          if (startMs && endMs) {
            totalWorkMs += endMs - startMs;
            if (lastEnd !== null) {
              const pause = startMs - lastEnd;
              if (pause > 0) {
                totalPauseMs += pause;
                pauseCount++;
              }
            }
            lastEnd = endMs;
          }
        });
      }
      const startTime = sessions[0]?.start?.toDate().toLocaleString() || '—';
      const endTime = sessions.at(-1)?.end?.toDate().toLocaleString() || '—';
      return { totalWorkMs, totalPauseMs, pauseCount, startTime, endTime };
    }

    // Get buttons HTML for each status (for table view)
    function getButtonsHTML(statusKey) {
      return {
        "not-started": `<button class="btn-start highlight">Start</button>`,
        "in-progress": `<button class="btn-pending">Pause</button><button class="btn-complete highlight">Complete</button>`,
        "pending": `<button class="btn-continue highlight">Resume</button>`,
        "complete": `<em>Completed</em>`
      }[statusKey] || `<em>No actions available</em>`;
    }

    // Toggle combo box row in table view
    function toggleComboBox(idx) {
      document.querySelectorAll(".combo-box").forEach((r, i) => {
        r.style.display = (idx === i && r.style.display !== "table-row") ? "table-row" : "none";
      });
    }

    // Render Table View tasks
    function renderTable(tasks) {
      taskBody.innerHTML = "";
      tasks.forEach((task, idx) => {
        const sk = (task.Status || "").toLowerCase().replace(/\s+/g, "-");
        const { totalWorkMs, totalPauseMs, pauseCount, startTime, endTime } = calcTimeDetails(task.workSessions);
        const ownerName = task.Owner || "No Owner";

        const tr = document.createElement("tr");
        tr.onclick = () => toggleComboBox(idx);
        tr.innerHTML = `
          <td>${task.SINO}</td>
          <td>${task["Existing Company Name"]}</td>
          <td>${task["TYPE OF WORK"]}</td>
          <td>${task["Due date"] || "—"}</td>
          <td class="status ${statusLabels[sk]?.class}">${statusLabels[sk]?.label}</td>
          <td>${ownerName}</td>
          <td>${formatMs(totalWorkMs)}</td>
        `;
        taskBody.appendChild(tr);

        const cr = document.createElement("tr");
        cr.className = "combo-box";
        cr.style.display = "none";
        cr.innerHTML = `
          <td colspan="7">
            <div><strong>Started:</strong> ${startTime}</div>
            <div><strong>Ended:</strong> ${endTime}</div>
            <div><strong>Work hrs:</strong> ${formatMs(totalWorkMs)}</div>
            <div><strong>Pause hrs:</strong> ${formatMs(totalPauseMs)}</div>
            <div><strong>Remarks:</strong> ${pauseCount > 1 ? '-' : (task.Remarks || '')}</div>
            <hr style="margin:8px 0;">
            ${getButtonsHTML(sk)}
          </td>
        `;
        taskBody.appendChild(cr);
      });
      attachActions(tasks, "table");
    }

    // Render Kanban view grouped by status
    function renderKanban(tasks) {
      kanbanView.innerHTML = "";
      const groups = {
        "not-started": [],
        "in-progress": [],
        "pending": [],
        "complete": []
      };
      tasks.forEach(t => {
        const sk = (t.Status || "").toLowerCase().replace(/\s+/g, "-");
        if (groups[sk]) groups[sk].push(t);
        else groups["not-started"].push(t); // fallback
      });

      for (const statusKey in groups) {
        const col = document.createElement("div");
        col.className = "kanban-column";
        col.innerHTML = `<h3>${statusLabels[statusKey]?.label || statusKey}</h3>`;

        groups[statusKey].forEach(task => {
          const { totalWorkMs } = calcTimeDetails(task.workSessions);
          const ownerName = task.Owner || "No Owner";
          const card = document.createElement("div");
          card.className = "kanban-card";
          card.innerHTML = `
            <strong>${task["TYPE OF WORK"] || "Task"}</strong>
            <div>Company: ${task["Existing Company Name"] || "-"}</div>
            <div>Owner: ${ownerName}</div>
            <div>Work Hours: ${formatMs(totalWorkMs)}</div>
          `;
          card.onclick = () => openTaskDetailsPopup(task);
          col.appendChild(card);
        });

        kanbanView.appendChild(col);
      }
      attachActions(tasks, "kanban");
    }

    // Render Grouped view by Owner
    function renderGrouped(tasks) {
      groupedView.innerHTML = "";
      const groups = {};
      tasks.forEach(t => {
        const owner = t.Owner || "No Owner";
        if (!groups[owner]) groups[owner] = [];
        groups[owner].push(t);
      });

      for (const owner in groups) {
        const ownerDiv = document.createElement("div");
        ownerDiv.className = "group-owner";
        ownerDiv.innerHTML = `<h3>${owner}</h3>`;

        groups[owner].forEach(task => {
          const { totalWorkMs } = calcTimeDetails(task.workSessions);
          const card = document.createElement("div");
          card.className = "task-card";
          card.innerHTML = `
            <strong>${task["TYPE OF WORK"]}</strong><br/>
            Status: ${statusLabels[(task.Status || "").toLowerCase()]?.label || task.Status}<br/>
            Work Hours: ${formatMs(totalWorkMs)}
          `;
          ownerDiv.appendChild(card);
        });

        groupedView.appendChild(ownerDiv);
      }
      attachActions(tasks, "grouped");
    }

    // Attach actions to buttons (example)
    function attachActions(tasks, viewType) {
      // Attach your start/pause/complete button events here if needed
      // For brevity, left as stub
    }

    // Open a popup for task details (stub)
    function openTaskDetailsPopup(task) {
      alert(`Task Details:\n${task["TYPE OF WORK"]}\nStatus: ${task.Status}`);
    }

    // Render current view according to selected button
    let currentView = "table";

    function renderCurrentView() {
      tableView.style.display = currentView === "table" ? "table" : "none";
      kanbanView.style.display = currentView === "kanban" ? "flex" : "none";
      groupedView.style.display = currentView === "grouped" ? "block" : "none";

      if (currentView === "table") renderTable(allTasks);
      else if (currentView === "kanban") renderKanban(allTasks);
      else if (currentView === "grouped") renderGrouped(allTasks);
    }

    // View buttons click handlers
    btnTable.onclick = () => {
      currentView = "table";
      setActiveBtn(btnTable);
      renderCurrentView();
    };
    btnKanban.onclick = () => {
      currentView = "kanban";
      setActiveBtn(btnKanban);
      renderCurrentView();
    };
    btnGrouped.onclick = () => {
      currentView = "grouped";
      setActiveBtn(btnGrouped);
      renderCurrentView();
    };

    function setActiveBtn(btn) {
      [btnTable, btnKanban, btnGrouped].forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    // Load tasks initially
    loadTasks();
  </script>
</body>
</html>
