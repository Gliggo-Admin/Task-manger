<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager - Multiple Views</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      color: #333;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #222;
    }
    button.close-btn {
      background: #e74c3c;
      border: none;
      color: white;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      float: right;
      margin-bottom: 10px;
      transition: background-color 0.3s ease;
    }
    button.close-btn:hover {
      background: #c0392b;
    }
    /* View toggle buttons */
    #view-toggle {
      margin-bottom: 25px;
    }
    #view-toggle button {
      background: #2980b9;
      color: white;
      border: none;
      margin-right: 10px;
      padding: 10px 18px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 2px 5px rgba(41, 128, 185, 0.3);
    }
    #view-toggle button.active,
    #view-toggle button:hover {
      background: #1c5980;
    }

    /* Table view */
    table.task-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgb(0 0 0 / 0.1);
      overflow: hidden;
      margin-bottom: 40px;
    }
    table.task-table th, table.task-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      vertical-align: middle;
    }
    table.task-table th {
      background: #34495e;
      color: white;
      font-weight: 600;
    }
    table.task-table tbody tr:hover {
      background-color: #f1f1f1;
      cursor: pointer;
    }
    /* Status badges */
    td.status {
      font-weight: 700;
      color: white;
      padding: 6px 12px;
      border-radius: 15px;
      display: inline-block;
      font-size: 0.85rem;
      min-width: 90px;
      text-align: center;
      user-select: none;
    }
    .status.not-started {
      background-color: #7f8c8d; /* grey */
    }
    .status.in-progress {
      background-color: #2980b9; /* blue */
    }
    .status.pending {
      background-color: #f39c12; /* orange */
      color: black;
    }
    /* Buttons in expanded row */
    .combo-box {
      display: none;
      background: #fafafa;
      box-shadow: inset 0 0 5px #ddd;
      border-radius: 8px;
      padding: 12px 20px;
      user-select: none;
    }
    .combo-box button {
      margin-right: 12px;
      padding: 10px 22px;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      color: white;
      box-shadow: 0 3px 8px rgb(0 0 0 / 0.15);
    }
    .combo-box button:hover {
      transform: scale(1.07);
      box-shadow: 0 6px 16px rgb(0 0 0 / 0.25);
    }
    .btn-start {
      background-color: #2980b9;
      box-shadow: 0 4px 12px rgba(41, 128, 185, 0.5);
    }
    .btn-pending {
      background-color: #e67e22;
      box-shadow: 0 4px 12px rgba(230, 126, 34, 0.5);
    }
    .btn-continue {
      background-color: #8e44ad;
      box-shadow: 0 4px 12px rgba(142, 68, 173, 0.5);
    }
    .btn-complete {
      background-color: #27ae60;
      box-shadow: 0 4px 12px rgba(39, 174, 96, 0.5);
    }
    /* Highlighted button */
    .highlight {
      border: 2px solid #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.75);
    }

    /* Group view (cards) */
    #group-view {
      display: none;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    #group-view .group-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      width: 320px;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }
    #group-view .group-card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-weight: 700;
      color: #34495e;
    }
    #group-view .group-card p {
      margin: 4px 0;
      font-size: 0.9rem;
      color: #555;
    }
    #group-view .group-card .status {
      align-self: flex-start;
      margin-top: 10px;
    }
    #group-view .group-card button {
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 18px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
      color: white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }
    #group-view .btn-start {
      background: #2980b9;
    }
    #group-view .btn-pending {
      background: #e67e22;
    }
    #group-view .btn-continue {
      background: #8e44ad;
    }
    #group-view .btn-complete {
      background: #27ae60;
    }
    #group-view .group-card button:hover {
      filter: brightness(1.1);
    }

    /* Kanban styles */
    #kanban-container {
      display: none;
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 10px;
    }
    .kanban-column {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .kanban-column-header {
      background: #34495e;
      color: white;
      padding: 14px 20px;
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 12px 12px 0 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .kanban-task {
      background: #fafafa;
      margin: 12px 16px;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);
      cursor: grab;
      transition: background-color 0.3s ease;
      outline: none;
    }
    .kanban-task:focus,
    .kanban-task:hover {
      background-color: #e8f0fe;
      box-shadow: 0 4px 14px rgb(41 128 185 / 0.3);
    }
    .kanban-task .status {
      margin-top: 10px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 18px;
      display: inline-block;
      user-select: none;
    }
    .kanban-task .status.not-started {
      background-color: #7f8c8d;
    }
    .kanban-task .status.in-progress {
      background-color: #2980b9;
    }
    .kanban-task .status.pending {
      background-color: #f39c12;
      color: black;
    }
    .kanban-task button {
      margin-top: 12px;
      padding: 8px 20px;
      font-weight: 700;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      color: white;
      transition: background-color 0.3s ease, transform 0.3s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      user-select: none;
    }
    .kanban-task button:hover {
      transform: scale(1.1);
      filter: brightness(1.15);
    }
    .kanban-task .btn-start {
      background-color: #2980b9;
    }
    .kanban-task .btn-pending {
      background-color: #e67e22;
    }
    .kanban-task .btn-continue {
      background-color: #8e44ad;
    }
    .kanban-task .btn-complete {
      background-color: #27ae60;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      #group-view, #kanban-container {
        flex-direction: column;
        width: 100%;
      }
      .kanban-column, #group-view .group-card {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <button class="close-btn" onclick="window.history.back()">Back</button>
  <h2>Apple Task Details</h2>

  <div id="view-toggle">
    <button id="btn-table" class="active">Table View</button>
    <button id="btn-group">Group View</button>
    <button id="btn-kanban">Kanban View</button>
  </div>

  <!-- Table View -->
  <table class="task-table" id="table-view">
    <thead>
      <tr>
        <th>SINO</th>
        <th>Company</th>
        <th>Task</th>
        <th>Due Date</th>
        <th>Status</th>
        <th>Owner</th>
        <th>Work Hours</th>
      </tr>
    </thead>
    <tbody id="task-body"></tbody>
  </table>

  <!-- Group View -->
  <div id="group-view"></div>

  <!-- Kanban View -->
  <div id="kanban-container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    });
    const db = firebase.firestore();

    const taskBody = document.getElementById("task-body");
    const tableView = document.getElementById("table-view");
    const groupView = document.getElementById("group-view");
    const kanbanContainer = document.getElementById("kanban-container");

    const btnTable = document.getElementById("btn-table");
    const btnGroup = document.getElementById("btn-group");
    const btnKanban = document.getElementById("btn-kanban");

    const statusLabels = {
      "not-started": {label:"Not Started", class:"not-started"},
      "in-progress": {label:"In Progress", class:"in-progress"},
      "pending": {label:"Pending", class:"pending"}
    };

    const now = () => firebase.firestore.Timestamp.now();

    function formatMs(ms) {
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600),
            m = Math.floor((s % 3600) / 60),
            sec = s % 60;
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function calcTimeDetails(sessions = []) {
      let totalWorkMs = 0, totalPauseMs = 0, pauseCount = 0, lastEnd = null;
      if (Array.isArray(sessions)) {
        sessions.forEach(sess => {
          const startMs = sess.start?.toDate().getTime(),
                endMs = sess.end?.toDate().getTime();
          if (startMs && endMs) {
            totalWorkMs += endMs - startMs;
            if (lastEnd !== null) {
              const pause = startMs - lastEnd;
              if (pause > 0) {
                totalPauseMs += pause;
                pauseCount++;
              }
            }
            lastEnd = endMs;
          }
        });
      }
      const startTime = sessions[0]?.start?.toDate().toLocaleString() || '—';
      const endTime = sessions.at(-1)?.end?.toDate().toLocaleString() || '—';
      return { totalWorkMs, totalPauseMs, pauseCount, startTime, endTime };
    }

    function getButtonsHTML(statusKey) {
      return {
        "not-started": `<button class="btn-start highlight">Start</button>`,
        "in-progress": `<button class="btn-pending">Pause</button><button class="btn-complete highlight">Complete</button>`,
        "pending": `<button class="btn-continue highlight">Resume</button>`
      }[statusKey] || `<em>No actions available</em>`;
    }

    // Show/hide combo box on row click
    function toggleComboBox(idx) {
      document.querySelectorAll(".combo-box").forEach((r, i) => {
        r.style.display = (idx === i && r.style.display !== "table-row") ? "table-row" : "none";
      });
    }

    // Render Table view
    function renderTasks(tasks) {
      taskBody.innerHTML = "";
      tasks.forEach((task, i) => {
        const { SINO, Company, Task, DueDate, Status, Owner, WorkHours, sessions = [] } = task;
        const statusKey = Status.toLowerCase().replace(/\s/g, "-");
        // Show only Not Started, In Progress, Pending
        if (!["not-started", "in-progress", "pending"].includes(statusKey)) return;

        const { totalWorkMs } = calcTimeDetails(sessions);

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${SINO}</td>
          <td>${Company || ""}</td>
          <td>${Task || ""}</td>
          <td>${DueDate || ""}</td>
          <td class="status ${statusKey}">${statusLabels[statusKey]?.label || Status}</td>
          <td>${Owner || ""}</td>
          <td>${formatMs(totalWorkMs)}</td>
        `;
        tr.style.userSelect = "none";
        tr.onclick = () => toggleComboBox(i);

        const comboRow = document.createElement("tr");
        comboRow.classList.add("combo-box");
        comboRow.innerHTML = `
          <td colspan="7" style="text-align:center;">
            ${getButtonsHTML(statusKey)}
          </td>
        `;

        // Add event listeners for buttons
        comboRow.querySelectorAll("button").forEach(btn => {
          btn.onclick = e => {
            e.stopPropagation();
            handleActionClick(task, btn);
          };
        });

        taskBody.appendChild(tr);
        taskBody.appendChild(comboRow);
      });
    }

    // Render Group View
    function renderGroupView(tasks) {
      groupView.innerHTML = "";
      tasks.forEach(task => {
        const { SINO, Company, Task, DueDate, Status, Owner, WorkHours, sessions = [] } = task;
        const statusKey = Status.toLowerCase().replace(/\s/g, "-");
        if (!["not-started", "in-progress", "pending"].includes(statusKey)) return;
        const { totalWorkMs } = calcTimeDetails(sessions);

        const card = document.createElement("div");
        card.className = "group-card";
        card.innerHTML = `
          <h3>${Company || "—"}</h3>
          <p><strong>Task:</strong> ${Task || "—"}</p>
          <p><strong>Due Date:</strong> ${DueDate || "—"}</p>
          <p><strong>Owner:</strong> ${Owner || "—"}</p>
          <p><strong>Work Hours:</strong> ${formatMs(totalWorkMs)}</p>
          <span class="status ${statusKey}">${statusLabels[statusKey]?.label || Status}</span>
          <div style="margin-top: 15px;">
            ${getButtonsHTML(statusKey)}
          </div>
        `;

        // Attach event handlers to buttons inside card
        card.querySelectorAll("button").forEach(btn => {
          btn.onclick = e => {
            e.stopPropagation();
            handleActionClick(task, btn);
          };
        });

        groupView.appendChild(card);
      });
    }

    // Render Kanban View
    function renderKanban(tasks) {
      kanbanContainer.innerHTML = "";
      const columns = {
        "not-started": [],
        "in-progress": [],
        "pending": []
      };
      tasks.forEach(task => {
        const statusKey = task.Status.toLowerCase().replace(/\s/g, "-");
        if (!["not-started", "in-progress", "pending"].includes(statusKey)) return;
        columns[statusKey].push(task);
      });

      for (const [statusKey, tasksArr] of Object.entries(columns)) {
        const column = document.createElement("div");
        column.className = "kanban-column";

        const header = document.createElement("div");
        header.className = "kanban-column-header";
        header.textContent = statusLabels[statusKey]?.label || statusKey;
        column.appendChild(header);

        tasksArr.forEach(task => {
          const { SINO, Company, Task, DueDate, Owner, WorkHours, sessions = [] } = task;
          const { totalWorkMs } = calcTimeDetails(sessions);

          const card = document.createElement("div");
          card.className = "kanban-task";
          card.tabIndex = 0;
          card.innerHTML = `
            <div><strong>${Company}</strong> (${SINO})</div>
            <div>${Task}</div>
            <div><small>Due: ${DueDate}</small></div>
            <div><small>Owner: ${Owner}</small></div>
            <div><small>Work Hours: ${formatMs(totalWorkMs)}</small></div>
            <span class="status ${statusKey}">${statusLabels[statusKey]?.label || ""}</span>
            <div>
              ${getButtonsHTML(statusKey)}
            </div>
          `;

          // Add event listeners to buttons inside kanban card
          card.querySelectorAll("button").forEach(btn => {
            btn.onclick = e => {
              e.stopPropagation();
              handleActionClick(task, btn);
            };
          });

          column.appendChild(card);
        });

        kanbanContainer.appendChild(column);
      }
    }

    function handleActionClick(task, btn) {
      const action = btn.textContent.toLowerCase();
      const docId = task.id;
      if (!docId) {
        alert("Task ID missing.");
        return;
      }

      // Get current task sessions or empty array
      let sessions = task.sessions || [];

      if (action === "start") {
        // Start a new work session
        const nowTime = firebase.firestore.Timestamp.now();
        sessions.push({ start: nowTime, end: null });
        updateTask(docId, { Status: "In Progress", sessions });
      } else if (action === "pause") {
        // Pause current session (set last end time)
        const lastSession = sessions[sessions.length - 1];
        if (lastSession && !lastSession.end) {
          lastSession.end = firebase.firestore.Timestamp.now();
          updateTask(docId, { Status: "Pending", sessions });
        }
      } else if (action === "resume") {
        // Resume work - start new session, status to in progress
        sessions.push({ start: firebase.firestore.Timestamp.now(), end: null });
        updateTask(docId, { Status: "In Progress", sessions });
      } else if (action === "complete") {
        // Complete task - set last session end time if not set
        const lastSession = sessions[sessions.length - 1];
        if (lastSession && !lastSession.end) {
          lastSession.end = firebase.firestore.Timestamp.now();
        }
        updateTask(docId, { Status: "Complete", sessions });
      }
    }

    function updateTask(docId, updateData) {
      db.collection("tasks").doc(docId).update(updateData)
        .then(() => {
          alert("Task updated successfully!");
          loadTasks();
        })
        .catch(err => {
          alert("Error updating task: " + err.message);
          console.error(err);
        });
    }

    // Load tasks from Firestore and render views
    function loadTasks() {
      db.collection("tasks")
        .orderBy("SINO")
        .get()
        .then(snapshot => {
          const tasks = [];
          snapshot.forEach(doc => {
            tasks.push({ id: doc.id, ...doc.data() });
          });

          renderTasks(tasks);
          renderGroupView(tasks);
          renderKanban(tasks);
        })
        .catch(err => {
          console.error("Error fetching tasks:", err);
          alert("Failed to load tasks.");
        });
    }

    // View toggle handlers
    btnTable.onclick = () => {
      btnTable.classList.add("active");
      btnGroup.classList.remove("active");
      btnKanban.classList.remove("active");
      tableView.style.display = "";
      groupView.style.display = "none";
      kanbanContainer.style.display = "none";
    };
    btnGroup.onclick = () => {
      btnGroup.classList.add("active");
      btnTable.classList.remove("active");
      btnKanban.classList.remove("active");
      groupView.style.display = "flex";
      tableView.style.display = "none";
      kanbanContainer.style.display = "none";
    };
    btnKanban.onclick = () => {
      btnKanban.classList.add("active");
      btnTable.classList.remove("active");
      btnGroup.classList.remove("active");
      kanbanContainer.style.display = "flex";
      tableView.style.display = "none";
      groupView.style.display = "none";
    };

    // Initial load
    loadTasks();
  </script>
</body>
</html>
