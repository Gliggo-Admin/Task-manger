<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
</head>
<body>
  <h1>Attendance System</h1>

  <!-- Attendance Actions -->
  <button onclick="markAttendance('clock_in')">Clock In</button>
  <button onclick="markAttendance('break_in')">Break In</button>
  <button onclick="markAttendance('break_out')">Break Out</button>
  <button onclick="markAttendance('clock_out')">Clock Out</button>

  <hr>

  <!-- Leave Request Form -->
  <h2>Submit Leave Request</h2>
  <form onsubmit="submitLeave(event)">
    <input type="date" id="leaveDate" required>
    <input type="text" id="leaveReason" placeholder="Reason" required>
    <button type="submit">Submit Leave</button>
  </form>

  <hr>

  <!-- Attendance Logs -->
  <h2>Attendance Logs</h2>
  <ul id="attendanceLogs"></ul>

  <!-- Leave Records -->
  <h2>Leave Records</h2>
  <ul id="leaveRecords"></ul>

  <script type="module">
    // Firebase Config
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, query, where, getDocs, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0",
      measurementId: "G-RK6GS598ES"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadAttendanceLogs();
        loadLeaveRecords();
      } else {
        alert("Please login first.");
        // Optionally redirect to login page
      }
    });

    async function markAttendance(state) {
      if (!currentUser) return;

      try {
        await addDoc(collection(db, "attendanceLogs"), {
          userId: currentUser.uid,
          state,
          timestamp: serverTimestamp()
        });
        alert(`Marked: ${state}`);
        loadAttendanceLogs();
      } catch (err) {
        console.error("Error logging attendance:", err);
      }
    }

    async function submitLeave(e) {
      e.preventDefault();
      if (!currentUser) return;

      const date = document.getElementById("leaveDate").value;
      const reason = document.getElementById("leaveReason").value;

      try {
        await addDoc(collection(db, "leaves"), {
          userId: currentUser.uid,
          date,
          reason,
          timestamp: serverTimestamp()
        });
        alert("Leave submitted.");
        document.getElementById("leaveDate").value = '';
        document.getElementById("leaveReason").value = '';
        loadLeaveRecords();
      } catch (err) {
        console.error("Error submitting leave:", err);
      }
    }

    async function loadAttendanceLogs() {
      if (!currentUser) return;

      const q = query(
        collection(db, "attendanceLogs"),
        where("userId", "==", currentUser.uid),
        orderBy("timestamp", "desc")
      );

      const snapshot = await getDocs(q);
      const list = document.getElementById("attendanceLogs");
      list.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const li = document.createElement("li");
        li.textContent = `${data.state} at ${data.timestamp?.toDate().toLocaleString() || 'Pending'}`;
        list.appendChild(li);
      });
    }

    async function loadLeaveRecords() {
      if (!currentUser) return;

      const q = query(
        collection(db, "leaves"),
        where("userId", "==", currentUser.uid),
        orderBy("timestamp", "desc")
      );

      const snapshot = await getDocs(q);
      const list = document.getElementById("leaveRecords");
      list.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const li = document.createElement("li");
        li.textContent = `Leave on ${data.date} - ${data.reason}`;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
