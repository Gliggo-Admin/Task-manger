<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #34495e;
      color: white;
      display: flex;
      height: 100vh;
    }
    .left-panel {
      background: #2c3e50;
      width: 250px;
      padding: 30px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .left-panel .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .left-panel .header h2 {
      margin: 0 0 8px;
    }
    .left-panel .profile-image {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #7f8c8d;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: white;
      user-select: none;
    }
    .summary {
      margin-top: 20px;
    }
    .summary h3 {
      border-bottom: 1px solid #7f8c8d;
      padding-bottom: 5px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .summary p {
      margin: 8px 0;
      font-weight: 600;
    }
    .logout-button {
      background: #e74c3c;
      border: none;
      color: white;
      padding: 12px 0;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      transition: background 0.3s;
    }
    .logout-button:hover {
      background: #c0392b;
    }
    .right-panel {
      background: white;
      flex: 1;
      padding: 30px;
      box-sizing: border-box;
      color: #2c3e50;
      overflow-y: auto;
    }
    .right-panel h1 {
      margin-top: 0;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .todo-list li {
      padding: 12px 15px;
      border-bottom: 1px solid #bdc3c7;
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .todo-list li.completed label {
      text-decoration: line-through;
      color: #95a5a6;
    }
    .todo-list li input[type="checkbox"] {
      margin-right: 12px;
      cursor: pointer;
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <div class="left-panel">
    <div class="header">
      <div class="profile-image" id="profileImage">?</div>
      <h2 id="profileName">Loading...</h2>
      <p id="profileEmail" style="color:#bdc3c7; font-weight: 400; font-size: 14px;">&nbsp;</p>
    </div>

    <div class="summary">
      <h3>Summary</h3>
      <p>Total Tasks: <span id="totalTasks">0</span></p>
      <p>Completed: <span id="completedTasks">0</span></p>
      <p>Pending: <span id="pendingTasks">0</span></p>
    </div>

    <button id="logoutBtn" class="logout-button">Logout</button>
  </div>

  <div class="right-panel">
    <h1>Your Tasks</h1>
    <ul id="todoList" class="todo-list">
      <li>Loading tasks...</li>
    </ul>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase config and initialization
    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const profileNameEl = document.getElementById("profileName");
    const profileEmailEl = document.getElementById("profileEmail");
    const profileImageEl = document.getElementById("profileImage");
    const todoListEl = document.getElementById("todoList");
    const totalTasksEl = document.getElementById("totalTasks");
    const completedTasksEl = document.getElementById("completedTasks");
    const pendingTasksEl = document.getElementById("pendingTasks");
    const logoutBtn = document.getElementById("logoutBtn");

    // Set profile image initials from name
    function getInitials(name) {
      if (!name) return "?";
      const parts = name.trim().split(" ");
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
      return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
    }

    // Render tasks in checklist
    function renderTasks(tasks) {
      todoListEl.innerHTML = "";

      if (tasks.length === 0) {
        todoListEl.innerHTML = "<li>No tasks assigned.</li>";
        totalTasksEl.textContent = "0";
        completedTasksEl.textContent = "0";
        pendingTasksEl.textContent = "0";
        return;
      }

      let completedCount = 0;
      tasks.forEach((task, i) => {
        const li = document.createElement("li");
        if (task.completed) {
          li.classList.add("completed");
          completedCount++;
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed || false;
        checkbox.id = `task-${i}`;

        const label = document.createElement("label");
        label.htmlFor = checkbox.id;
        label.textContent = task["TYPE OF WORK"] || task.text || "Untitled Task";

        // Toggle completed on checkbox change
        checkbox.addEventListener("change", () => {
          const newCompleted = checkbox.checked;
          li.classList.toggle("completed", newCompleted);

          // Update Firestore task document
          updateTaskCompletion(task.docId, newCompleted);
        });

        li.appendChild(checkbox);
        li.appendChild(label);
        todoListEl.appendChild(li);
      });

      totalTasksEl.textContent = tasks.length;
      completedTasksEl.textContent = completedCount;
      pendingTasksEl.textContent = tasks.length - completedCount;
    }

    // Update task completion status in Firestore
    async function updateTaskCompletion(docId, completed) {
      if (!docId) return;
      try {
        await db.collection("tasks").doc(docId).update({ completed });
      } catch (err) {
        console.error("Error updating task completion:", err);
        alert("Failed to update task. Please try again.");
      }
    }

    // Load user tasks from Firestore filtering by assigned email
    async function loadTasksForUser(userEmail) {
      try {
        const snapshot = await db.collection("tasks")
          .where("AssignedTo", "==", userEmail)
          .get();

        if (snapshot.empty) {
          renderTasks([]);
          return;
        }

        const tasks = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          data.docId = doc.id; // save doc ID for updates
          tasks.push(data);
        });

        renderTasks(tasks);
      } catch (error) {
        console.error("Error loading tasks:", error);
        todoListEl.innerHTML = "<li style='color:red'>Failed to load tasks.</li>";
      }
    }

    // Listen to auth state changes
    auth.onAuthStateChanged(user => {
      if (user) {
        const displayName = user.displayName || user.email || "User";
        profileNameEl.textContent = displayName;
        profileEmailEl.textContent = user.email || "";
        profileImageEl.textContent = getInitials(displayName);
        loadTasksForUser(user.email);
      } else {
        // Not logged in, redirect to login page (index.html)
        window.location.href = "index.html";
      }
    });

    // Logout button handler
    logoutBtn.addEventListener("click", () => {
      auth.signOut()
        .then(() => {
          window.location.href = "index.html";
        })
        .catch(error => {
          console.error("Logout failed:", error);
          alert("Logout failed, please try again.");
        });
    });
  </script>
</body>
</html>
