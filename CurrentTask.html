<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>User Current Task</title>
  <style>
    /* ... your existing styles ... */
    /* Remove login form styles related to email/password and adjust for username */
    #login-form {
      background: #fff;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 400px;
      margin-bottom: 20px;
    }
    #login-form input {
      width: calc(100% - 24px);
      padding: 10px;
      margin-bottom: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #login-form button {
      background: #2980b9;
      color: white;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    #login-error {
      color: red;
      font-size: 0.9rem;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <button class="close-btn" onclick="window.history.back()">Back</button>
  <h2>User Task Details</h2>

  <div id="login-form">
    <input type="text" id="username" placeholder="Enter username" autocomplete="off" />
    <button id="load-btn">Load Tasks</button>
    <div id="login-error"></div>
  </div>

  <p class="user-info" id="userInfo">Please enter your username and load tasks.</p>

  <table class="task-table" aria-label="User tasks">
    <thead>
      <tr><th>SINO</th><th>Company</th><th>Task</th><th>Due Date</th><th>Status</th><th>Work Hours</th></tr>
    </thead>
    <tbody id="task-body"><tr><td colspan="6" style="text-align:center;">No tasks loaded.</td></tr></tbody>
  </table>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da"
    });

    const db = firebase.firestore();

    const taskBody = document.getElementById("task-body");
    const userInfo = document.getElementById("userInfo");
    const loginForm = document.getElementById("login-form");
    const loadBtn = document.getElementById("load-btn");
    const usernameInput = document.getElementById("username");
    const loginError = document.getElementById("login-error");

    const statusLabels = {
      "not-started": {label:"Not Started", class:"not-started"},
      "in-progress": {label:"In Progress", class:"in-progress"},
      "pending": {label:"Pending", class:"pending"},
      "complete": {label:"Completed", class:"complete"}
    };

    function formatMs(ms) {
      const s = Math.floor(ms/1000),
            h = Math.floor(s/3600),
            m = Math.floor((s%3600)/60),
            sec = s % 60;
      return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }

    function calcTimeDetails(sessions=[]) {
      let totalWork=0, totalPause=0, pauseCount=0, lastEnd=null;
      sessions.forEach(sess => {
        const a = sess.start?.toDate().getTime();
        const b = sess.end?.toDate().getTime();
        if (a && b) {
          totalWork += b - a;
          if (lastEnd !== null && a > lastEnd) {
            totalPause += a - lastEnd;
            pauseCount++;
          }
          lastEnd = b;
        }
      });
      return {
        totalWorkMs: totalWork,
        totalPauseMs: totalPause,
        pauseCount,
        startTime: sessions[0]?.start?.toDate().toLocaleString() || '—',
        endTime: sessions.at(-1)?.end?.toDate().toLocaleString() || '—'
      };
    }

    function getButtonsHTML(sk) {
      return {
        "not-started": `<button class="btn-start highlight" type="button">Start</button>`,
        "in-progress": `<button class="btn-pending" type="button">Pause</button><button class="btn-complete highlight" type="button">Complete</button>`,
        "pending": `<button class="btn-continue highlight" type="button">Resume</button>`
      }[sk] || `<em>No actions</em>`;
    }

    function toggleComboBox(idx) {
      document.querySelectorAll(".combo-box").forEach((row, i) => {
        row.style.display = (i === idx && row.style.display !== "table-row") ? "table-row" : "none";
      });
    }

    function renderTasks(tasks) {
      taskBody.innerHTML = "";
      if (tasks.length === 0) {
        taskBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No tasks found.</td></tr>`;
        return;
      }

      tasks.forEach((t, idx) => {
        const sk = (t.Status || "").toLowerCase().replace(/\s+/g,"-");
        const { totalWorkMs, totalPauseMs, pauseCount, startTime, endTime } = calcTimeDetails(t.workSessions);

        const tr = document.createElement("tr");
        tr.onclick = () => toggleComboBox(idx);
        tr.innerHTML = `
          <td>${t.SINO || "-"}</td>
          <td>${t["Existing Company Name"] || "-"}</td>
          <td>${t["TYPE OF WORK"] || "-"}</td>
          <td>${t["Due date"] || "-"}</td>
          <td class="status ${statusLabels[sk]?.class || ''}">${statusLabels[sk]?.label || t.Status || "-"}</td>
          <td>${formatMs(totalWorkMs)}</td>
        `;
        taskBody.appendChild(tr);

        const cr = document.createElement("tr");
        cr.className = "combo-box";
        cr.style.display = "none";
        cr.innerHTML = `<td colspan="6">
          <div><strong>Started:</strong> ${startTime}</div>
          <div><strong>Ended:</strong> ${endTime}</div>
          <div><strong>Work hrs:</strong> ${formatMs(totalWorkMs)}</div>
          <div><strong>Pause hrs:</strong> ${formatMs(totalPauseMs)}</div>
          <div><strong>Remarks:</strong> ${pauseCount > 1 ? '-' : (t.Remarks || '')}</div>
          <hr style="margin:8px 0;">${getButtonsHTML(sk)}
        </td>`;
        taskBody.appendChild(cr);
      });

      // If you want, you can attach action handlers here as before
      // attachActions(tasks);
    }

    async function loadUserTasks(username) {
      if (!username) {
        loginError.textContent = "Please enter a username.";
        loginError.style.display = "block";
        return;
      }
      loginError.style.display = "none";
      userInfo.textContent = `Loading tasks for: ${username}...`;
      taskBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Loading...</td></tr>`;

      try {
        // Adjust the query field here as per your Firestore field for username
        // For example, if tasks have "OwnerName" field:
        const allowedStatuses = ["Not Started", "In Progress", "Pending"];
        const tasksRef = db.collection("tasks");
        const querySnapshot = await tasksRef
          .where("OwnerName", "==", username)
          .where("Status", "in", allowedStatuses)
          .get();

        const tasks = [];
        querySnapshot.forEach(doc => {
          const data = doc.data();
          data.id = doc.id;
          tasks.push(data);
        });

        userInfo.textContent = `Tasks for: ${username}`;
        renderTasks(tasks);
      } catch (err) {
        console.error(err);
        loginError.textContent = "Failed to load tasks. Please try again.";
        loginError.style.display = "block";
        taskBody.innerHTML = `<tr><td colspan="6" style="color:red;">Failed to load tasks</td></tr>`;
      }
    }

    loadBtn.onclick = () => {
      const username = usernameInput.value.trim();
      loadUserTasks(username);
    };
  </script>

</body>
</html>
