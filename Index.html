<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – Task Manager</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex;
      justify-content: center; align-items: center;
      background: #1abc9c; font-family: 'Segoe UI';
    }
    .card {
      width: 360px; padding: 40px; background: #fff;
      border-radius: 15px; box-shadow: 0 12px 24px rgba(0,0,0,0.2);
    }
    h2 { margin-bottom: 24px; color: #16a085; text-align: center; }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; margin-bottom: 6px; color: #2c3e50; font-weight: 600; }
    .input-group input {
      width: 100%; padding: 12px;
      font-size: 16px; border: none;
      border-radius: 10px; background: #f1f1f1;
      box-shadow: inset 2px 2px 5px #ccc, inset -2px -2px 5px #fff;
      transition: all 0.3s;
    }
    .input-group input:focus {
      outline: none; background: #eafaf6;
      box-shadow: inset 1px 1px 4px #aaa, inset -1px -1px 4px #fff;
    }
    button {
      width: 100%; padding: 12px; background: #16a085;
      color: #fff; border: none; font-size: 16px;
      font-weight: bold; border-radius: 8px;
      cursor: pointer; transition: background 0.3s;
    }
    button:hover { background: #1abc9c; }
    .forgot { margin-top: 14px; text-align: right; }
    .forgot a { color: #16a085; text-decoration: none; font-size: 14px; }
    .forgot a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Login</h2>

    <div id="login-section">
      <div class="input-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="Enter email" />
      </div>
      <div class="input-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" />
      </div>
      <button onclick="tryLogin()">Login</button>
      <div class="forgot">
        <a href="Change Password.html">Forgot password?</a>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Set authentication persistence
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
      .then(() => console.log("Auth persistence set to SESSION"))
      .catch((error) => console.error("Error setting auth persistence:", error));

    // Allow Enter key to submit login
    document.getElementById("loginEmail").addEventListener("keypress", function(e) {
      if (e.key === "Enter") tryLogin();
    });
    document.getElementById("loginPassword").addEventListener("keypress", function(e) {
      if (e.key === "Enter") tryLogin();
    });

    // Login function using Firebase Authentication
    async function tryLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      
      if (!email || !password) {
        alert("Please fill both email and password.");
        return;
      }

      try {
        // Sign in with Firebase Authentication
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;
        const userId = user.uid;

        // Fetch user data from Firestore
        const userDoc = await db.collection("users").doc(userId).get();
        if (!userDoc.exists) {
          throw new Error("User data not found in Firestore.");
        }

        const userData = userDoc.data();
        const username = userData.username || email.split('@')[0];
        const fullName = userData.fullName || "";
        const role = userData.role ? userData.role.trim().toLowerCase() : "";

        // Save user data to sessionStorage
        sessionStorage.setItem("userId", userId);
        sessionStorage.setItem("userEmail", email);
        sessionStorage.setItem("username", username);
        if (fullName) {
          sessionStorage.setItem("fullName", fullName);
        }

        console.log("✅ Logged in as:", username, "with role:", role);

        // Redirect based on role
        if (role === "admin") {
          window.location.href = "Home.html";
        } else if (role === "sub admin") {
          window.location.href = "Sub Admin Dashboard.html";
        } else if (role === "user") {
          window.location.href = "UserDashboard.html";
        } else {
          throw new Error("User role not recognized: " + userData.role);
        }
      } catch (error) {
        console.error("Login error:", error);
        alert("Login failed: " + error.message);
      }
    }

    // Check if user is already logged in
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const userDoc = await db.collection("users").doc(user.uid).get();
          if (userDoc.exists) {
            const userData = userDoc.data();
            const role = userData.role ? userData.role.trim().toLowerCase() : "";
            console.log("✅ Already logged in as:", userData.username || user.email);
            
            // Redirect based on role
            if (role === "admin") {
              window.location.href = "Home.html";
            } else if (role === "sub admin") {
              window.location.href = "Sub Admin Dashboard.html";
            } else if (role === "user") {
              window.location.href = "UserDashboard.html";
            } else {
              console.error("User role not recognized:", userData.role);
              alert("User role not recognized. Please contact support.");
            }
          } else {
            console.error("User data not found in Firestore.");
            auth.signOut();
            sessionStorage.clear();
          }
        } catch (error) {
          console.error("Error checking user data:", error);
          auth.signOut();
          sessionStorage.clear();
        }
      } else {
        console.log("❌ No user is logged in.");
      }
    });
  </script>
</body>
</html>
