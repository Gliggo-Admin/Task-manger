<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Dashboard – Task Manager</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7f9;
      margin: 0;
      padding: 0 20px 40px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }

    header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 2px solid #16a085;
      font-weight: 600;
      color: #16a085;
      user-select: none;
    }

    .left-label {
      font-size: 1.2rem;
    }

    .center-datetime {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .profile-container {
      position: relative;
      cursor: pointer;
    }

    .profile-name {
      color: #16a085;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 12px;
      background: #d1f0eb;
      transition: background 0.3s;
    }

    .profile-name:hover {
      background: #b0e4d8;
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 110%;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 8px 16px rgba(22, 160, 133, 0.25);
      width: 120px;
      z-index: 10;
    }

    .dropdown.show {
      display: block;
    }

    .dropdown button {
      width: 100%;
      padding: 10px;
      border: none;
      background: none;
      font-weight: 600;
      color: #16a085;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .dropdown button:hover {
      background: #1abc9c;
      color: white;
    }

    main {
      display: flex;
      gap: 24px;
      margin-top: 20px;
    }

    .sidebar {
      width: 180px;
      background-color: #ffffff;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(22, 160, 133, 0.15);
      padding: 20px;
      font-weight: 600;
      color: #16a085;
      user-select: none;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar .menu-item {
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .sidebar .menu-item:hover,
    .sidebar .menu-item.active {
      background-color: #1abc9c;
      color: white;
    }

    .main-content {
      display: flex;
      gap: 24px;
      flex-grow: 1;
    }

    .left-panel {
      flex: 1;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(22, 160, 133, 0.15);
      padding: 20px;
      min-height: 400px;
    }

    .right-panel {
      flex: 1;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(22, 160, 133, 0.15);
      padding: 20px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }

    .todo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .todo-header button {
      background: #16a085;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .todo-header button:hover {
      background: #1abc9c;
    }

    ul.todo-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
      overflow-y: auto;
      flex-grow: 1;
      max-height: 340px;
    }

    ul.todo-list li {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      font-size: 1rem;
    }

    ul.todo-list li label {
      margin-left: 8px;
      cursor: pointer;
      flex-grow: 1;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    ul.todo-list li.completed label {
      text-decoration: line-through;
      color: #999;
    }

    .add-task-container {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
    }

    .add-task-container input {
      flex-grow: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .add-task-container button {
      background: #16a085;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .add-task-container button:hover {
      background: #1abc9c;
    }

    /* New styles for left panel pending tasks */
    .pending-tasks {
      margin-top: 10px;
    }

    .pending-tasks h3 {
      color: #16a085;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    .pending-item {
      background: #f8f9fa;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border-left: 4px solid #16a085;
    }

    .pending-item h4 {
      margin: 0 0 5px 0;
      color: #16a085;
      font-size: 1rem;
    }

    .pending-item p {
      margin: 0;
      color: #666;
      font-size: 0.9rem;
    }

    .reminder-badge {
      background: #ffeb3b;
      color: #333;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="left-label">Tasks</div>
    <div class="center-datetime" id="dateTimeDisplay">Loading...</div>
    <div class="profile-container" id="profileContainer" tabindex="0" aria-haspopup="true" aria-expanded="false">
      <div class="profile-name" id="profileName">User</div>
<div class="dropdown" id="profileDropdown">
  <button id="settingBtn">Setting</button> <!-- New -->
  <button id="logoutBtn">Logout</button>
</div>

    </div>
  </header>

  <main>
    <nav class="sidebar">
      <ul>
        <li class="menu-item active" data-section="tasks">Tasks</li>
        <li class="menu-item" data-section="chart">View in Chart</li>
        <li class="menu-item" data-section="report">Generate Report</li>
      </ul>
    </nav>

    <div class="main-content">
      <section class="left-panel">
        <h2>Pending Tasks & Reminders</h2>
        <div id="pendingTasksContainer" class="pending-tasks">
          <p>Loading pending tasks...</p>
        </div>
      </section>

      <section class="right-panel">
        <div class="todo-header">
          <button id="prevDayBtn">&lt; Prev</button>
          <div id="todoDateLabel">Day 1</div>
          <button id="nextDayBtn">Next &gt;</button>
        </div>

        <div class="add-task-container">
          <input type="text" id="newTaskInput" placeholder="Add a new task..." />
          <button id="addTaskBtn">Add Task</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>
      </section>
    </div>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const username = sessionStorage.getItem("username");
    const fullName = sessionStorage.getItem("fullName");

    if (!username) {
      window.location.href = "index.html";
    } else {
      document.getElementById("profileName").textContent = fullName || username;
    }

    const profileContainer = document.getElementById("profileContainer");
    const dropdown = document.getElementById("profileDropdown");

    profileContainer.addEventListener("click", () => {
      const isShown = dropdown.classList.contains("show");
      dropdown.classList.toggle("show", !isShown);
      profileContainer.setAttribute("aria-expanded", !isShown);
    });

    document.addEventListener("click", (e) => {
      if (!profileContainer.contains(e.target)) {
        dropdown.classList.remove("show");
        profileContainer.setAttribute("aria-expanded", false);
      }
    });

document.getElementById("logoutBtn").addEventListener("click", () => {
  sessionStorage.clear();
  window.location.href = "index.html";
});
document.getElementById("settingBtn").addEventListener("click", () => {
  window.location.href = "Change Password.html";
});

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        dropdown.classList.remove("show");
        profileContainer.setAttribute("aria-expanded", false);
        profileContainer.focus();
      }
    });

    const dateTimeDisplay = document.getElementById("dateTimeDisplay");
    function updateDateTime() {
      const now = new Date();
      const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
      const dateStr = now.toLocaleDateString(undefined, options);
      const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      dateTimeDisplay.textContent = `${dateStr} ${timeStr}`;
    }
    updateDateTime();
    setInterval(updateDateTime, 60000);

    const todoListEl = document.getElementById("todoList");
    const todoDateLabel = document.getElementById("todoDateLabel");
    const prevDayBtn = document.getElementById("prevDayBtn");
    const nextDayBtn = document.getElementById("nextDayBtn");
    const newTaskInput = document.getElementById("newTaskInput");
    const addTaskBtn = document.getElementById("addTaskBtn");
    const pendingTasksContainer = document.getElementById("pendingTasksContainer");

    let currentDate = new Date();
    let allUserTasks = []; // To store all detailed tasks for reminders

    function getFormattedDate(date) {
      return date.toISOString().split("T")[0];
    }

    function getReadableDate(date) {
      return date.toLocaleDateString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric'
      });
    }

    // Function to calculate next due date based on period
    function calculateNextDueDate(startDateStr, period, currentDate) {
      const startDate = new Date(startDateStr);
      let nextDue = new Date(startDate);
      const today = new Date(currentDate);

      switch (period) {
        case 'Weekly':
          nextDue.setDate(startDate.getDate() + 7);
          while (nextDue < today) {
            nextDue.setDate(nextDue.getDate() + 7);
          }
          break;
        case 'Bi-weekly':
          nextDue.setDate(startDate.getDate() + 14);
          while (nextDue < today) {
            nextDue.setDate(nextDue.getDate() + 14);
          }
          break;
        case 'Monthly':
          nextDue.setMonth(startDate.getMonth() + 1);
          while (nextDue < today) {
            nextDue.setMonth(nextDue.getMonth() + 1);
          }
          break;
        case 'Quarterly':
          nextDue.setMonth(startDate.getMonth() + 3);
          while (nextDue < today) {
            nextDue.setMonth(nextDue.getMonth() + 3);
          }
          break;
        case 'Yearly':
          nextDue.setFullYear(startDate.getFullYear() + 1);
          while (nextDue < today) {
            nextDue.setFullYear(nextDue.getFullYear() + 1);
          }
          break;
        case 'Custom':
          // For custom, assume it's a one-time task unless period has date info; simplify to due date
          nextDue = new Date(startDateStr);
          break;
        default:
          nextDue = new Date(startDateStr);
      }

      return nextDue;
    }

    // Load all user tasks for reminders and daily tasks
    async function loadAllUserTasks() {
      try {
        const snapshot = await db.collection('tasks').where('Owner', '==', username).get();
        allUserTasks = [];
        snapshot.forEach(doc => {
          const taskData = { id: doc.id, ...doc.data() };
          allUserTasks.push(taskData);
        });

        // Render pending tasks and reminders in left panel
        renderPendingTasks();

        // For right panel, filter daily/simple tasks or map detailed tasks to simple format
        await loadTasks(currentDate);
      } catch (error) {
        console.error("Error loading tasks:", error);
        pendingTasksContainer.innerHTML = "<p>Error loading pending tasks.</p>";
      }
    }

    // Render pending tasks and reminders in left panel
    function renderPendingTasks() {
      const today = new Date();
      const pendingTasks = allUserTasks.filter(task => 
        task.Status !== 'Complete' && task.Status !== 'Completed'
      );

      // Calculate reminders for periodic tasks
      const reminders = pendingTasks
        .map(task => {
          if (task['WORK FOR'] && task['Period']) {
            const nextDue = calculateNextDueDate(task['Due date'] || task.createdAt?.toDate?.() || today, task['WORK FOR'], today);
            if (nextDue <= new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000)) { // Within next week
              return {
                ...task,
                nextDue,
                isReminder: true
              };
            }
          }
          return null;
        })
        .filter(Boolean)
        .sort((a, b) => a.nextDue - b.nextDue);

      const nonPeriodicPending = pendingTasks.filter(task => 
        !task['WORK FOR'] || !['Weekly', 'Bi-weekly', 'Monthly', 'Quarterly', 'Yearly', 'Custom'].includes(task['WORK FOR'])
      );

      let html = '<h3>Upcoming Reminders</h3>';
      if (reminders.length > 0) {
        reminders.forEach(task => {
          const dueStr = task.nextDue.toLocaleDateString();
          html += `
            <div class="pending-item">
              <h4>${task['Existing Company Name'] || 'N/A'} - ${task['TYPE OF WORK'] || task.Task || 'Task'}</h4>
              <p>Due: ${dueStr} (${task['WORK FOR']}) <span class="reminder-badge">Reminder</span></p>
            </div>
          `;
        });
      } else {
        html += '<p>No upcoming reminders.</p>';
      }

      html += '<h3>Other Pending Tasks</h3>';
      if (nonPeriodicPending.length > 0) {
        nonPeriodicPending.slice(0, 5).forEach(task => { // Limit to top 5
          html += `
            <div class="pending-item">
              <h4>${task['Existing Company Name'] || 'N/A'} - ${task['TYPE OF WORK'] || task.Task || 'Task'}</h4>
              <p>Status: ${task.Status || 'Not Started'}</p>
            </div>
          `;
        });
      } else {
        html += '<p>No other pending tasks.</p>';
      }

      pendingTasksContainer.innerHTML = html;
    }

    async function loadTasks(dateObj) {
      const dateKey = getFormattedDate(dateObj);
      todoDateLabel.textContent = getReadableDate(dateObj);
      todoListEl.innerHTML = "Loading...";

      try {
        // For compatibility, try to load simple daily tasks first, fallback to detailed tasks
        const docRef = db.collection("userTasks").doc(username);
        const docSnap = await docRef.get();
        let tasks = [];

        if (docSnap.exists) {
          const data = docSnap.data();
          if (data?.tasks?.[dateKey]) {
            tasks = data.tasks[dateKey];
          }
        }

        // If no simple tasks, map from detailed tasks for this date
        if (tasks.length === 0) {
          const todayTasks = allUserTasks.filter(task => {
            const dueDate = new Date(task['Due date']);
            return getFormattedDate(dueDate) === dateKey && task.Status !== 'Complete';
          });
          tasks = todayTasks.map(task => ({ text: `${task['Existing Company Name']} - ${task['TYPE OF WORK']}`, completed: false }));
        }

        renderTasks(tasks);
      } catch (error) {
        console.error("Error loading tasks:", error);
        todoListEl.innerHTML = "<li>Error loading tasks.</li>";
      }
    }

    function renderTasks(tasks) {
      if (!tasks || tasks.length === 0) {
        todoListEl.innerHTML = "<li>No tasks for this date.</li>";
        return;
      }

      todoListEl.innerHTML = "";
      tasks.forEach((task, i) => {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("completed");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed || false;
        checkbox.id = `task-${i}`;

        const label = document.createElement("label");
        label.htmlFor = checkbox.id;
        label.textContent = task.text;

        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          li.classList.toggle("completed", checkbox.checked);
          // For simple tasks, save back to userTasks
          saveTasks(currentDate, tasks);
        });

        li.appendChild(checkbox);
        li.appendChild(label);
        todoListEl.appendChild(li);
      });
    }

    async function saveTasks(dateObj, tasks) {
      const dateKey = getFormattedDate(dateObj);

      try {
        const docRef = db.collection("userTasks").doc(username);
        const docSnap = await docRef.get();
        let allTasks = {};

        if (docSnap.exists) {
          allTasks = docSnap.data().tasks || {};
        }

        allTasks[dateKey] = tasks;
        await docRef.set({ tasks: allTasks });
      } catch (error) {
        console.error("Error saving tasks:", error);
      }
    }

    addTaskBtn.addEventListener("click", () => {
      const taskText = newTaskInput.value.trim();
      if (!taskText) return alert("Please enter a task.");

      const newTask = { text: taskText, completed: false };
      allUserTasks.push(newTask); // Temp for rendering

      currentTasks.push(newTask);
      saveTasks(currentDate, currentTasks)
        .then(() => {
          renderTasks(currentTasks);
          newTaskInput.value = "";
          newTaskInput.focus();
        })
        .catch(() => {
          alert("Failed to save task, please try again.");
        });
    });

    newTaskInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        addTaskBtn.click();
      }
    });

    prevDayBtn.addEventListener("click", () => {
      currentDate.setDate(currentDate.getDate() - 1);
      loadTasks(currentDate);
    });

    nextDayBtn.addEventListener("click", () => {
      currentDate.setDate(currentDate.getDate() + 1);
      loadTasks(currentDate);
    });

document.querySelectorAll(".menu-item").forEach(item => {
  item.addEventListener("click", () => {
    document.querySelectorAll(".menu-item").forEach(el => el.classList.remove("active"));
    item.classList.add("active");

    const section = item.getAttribute("data-section");
    switch (section) {
      case "tasks":
        window.location.href = "User task.html";
        break;
      case "chart":
        window.location.href = "UserChart.html";
        break;
      case "report":
         window.location.href = "User Generate Report.Html";
        break;
    }
  });
});

    // Initialize
    loadAllUserTasks();
    loadTasks(currentDate);
  </script>
</body>
</html>
