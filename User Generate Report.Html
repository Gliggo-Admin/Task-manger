<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Generate Report</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- jsPDF, AutoTable, Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #e0f7fa, #ffffff);
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #16648d;
    }
    button {
      margin: 10px 10px 10px 0;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #2a9d8f;
      color: white;
    }
    button:hover {
      background-color: #21867a;
    }
    .filters {
      margin-bottom: 20px;
    }
    .filters label {
      margin-right: 10px;
    }
    .hidden {
      display: none;
    }
    #loading {
      margin-top: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>

<h1>User Task Report</h1>

<div class="filters">
  <label>
    Date Filter:
    <select id="dateFilter">
      <option value="all">All</option>
      <option value="thisMonth">This Month</option>
      <option value="lastMonth">Previous Month</option>
      <option value="custom">Custom Range</option>
    </select>
  </label>

  <span id="customDateInputs" class="hidden">
    <label>From: <input type="date" id="fromDate" /></label>
    <label>To: <input type="date" id="toDate" /></label>
  </span>
</div>

<button onclick="window.location.href='Home.html'">Home</button>
<button id="downloadCsvBtn" disabled>Download CSV</button>
<button id="downloadPdfBtn" disabled>Download PDF</button>

<div id="loading">Loading tasks for user...</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
    authDomain: "task-manager-602da.firebaseapp.com",
    projectId: "task-manager-602da",
    storageBucket: "task-manager-602da.appspot.com",
    messagingSenderId: "438978699329",
    appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const username = sessionStorage.getItem("username") || "";

  const headers = [
    "SINO", "Company Name", "TYPE OF WORK", "ACCOUNT TYPE", "Accounts / Cards", 
    "Task", "Status", "Owner", "Due date", "Assigned By", 
    "Time Started", "Time End", "Total Pause Hours", "Total Work Hours", "Remarks"
  ];

  let allTasks = [];

  async function loadTasks() {
    if (!username) {
      document.getElementById('loading').textContent = 'User not logged in.';
      return;
    }

    try {
      const snapshot = await db.collection('tasks').where("Owner", "==", username).get();
      allTasks = [];

      snapshot.forEach(doc => {
        const data = { id: doc.id, ...doc.data() };
        data["Due date"] = data["Due date"]?.seconds 
          ? new Date(data["Due date"].seconds * 1000)
          : new Date(data["Due date"]);
        allTasks.push(data);
      });

      document.getElementById('loading').textContent = `Loaded ${allTasks.length} tasks for ${username}.`;
      document.getElementById('downloadCsvBtn').disabled = false;
      document.getElementById('downloadPdfBtn').disabled = false;
    } catch (err) {
      console.error(err);
      document.getElementById('loading').textContent = 'Error loading tasks.';
    }
  }

  function isWithinRange(date, start, end) {
    return date instanceof Date && !isNaN(date) && date >= start && date <= end;
  }

  function applyFilters() {
    const filter = document.getElementById('dateFilter').value;
    const fromDate = document.getElementById('fromDate').value;
    const toDate = document.getElementById('toDate').value;
    const now = new Date();
    let filtered = [...allTasks];

    if (filter === 'thisMonth') {
      const start = new Date(now.getFullYear(), now.getMonth(), 1);
      const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      filtered = filtered.filter(task => isWithinRange(task["Due date"], start, end));
    } else if (filter === 'lastMonth') {
      const start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const end = new Date(now.getFullYear(), now.getMonth(), 0);
      filtered = filtered.filter(task => isWithinRange(task["Due date"], start, end));
    } else if (filter === 'custom' && fromDate && toDate) {
      const start = new Date(fromDate);
      const end = new Date(toDate);
      filtered = filtered.filter(task => isWithinRange(task["Due date"], start, end));
    }

    return filtered;
  }

  function escapeCSV(value) {
    if (!value) return "";
    const val = String(value);
    if (val.includes(",") || val.includes('"') || val.includes("\n")) {
      return `"${val.replace(/"/g, '""')}"`;
    }
    return val;
  }

  function formatDate(date) {
    return date instanceof Date ? date.toISOString().split("T")[0] : date || "";
  }

  function downloadCSV(tasks) {
    if (tasks.length === 0) return alert("No tasks to export.");
    const csvRows = [headers.join(",")];
    tasks.forEach((task, i) => {
      const row = [
        i + 1,
        escapeCSV(task["Existing Company Name"]),
        escapeCSV(task["TYPE OF WORK"]),
        escapeCSV(task["ACCOUNT TYPE"]),
        escapeCSV(task["Accounts / Cards"]),
        escapeCSV(task["Task"]),
        escapeCSV(task["Status"]),
        escapeCSV(task["Owner"]),
        formatDate(task["Due date"]),
        escapeCSV(task["Assigned By"]),
        escapeCSV(task["TimeStarted"] || task["Time Start"]),
        escapeCSV(task["TimeEnd"] || task["Time End"]),
        escapeCSV(task["TotalPauseHours"] || task["TOTAL OUT OF HOURS"]),
        escapeCSV(task["TotalWorkHours"] || task["Total Work Hours"]),
        escapeCSV(task["Remarks"] || task["Remarks (New)"])
      ];
      csvRows.push(row.join(","));
    });
    const blob = new Blob([csvRows.join("\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "user_tasks_report.csv";
    a.click();
  }

  async function downloadPDF(tasks) {
    if (tasks.length === 0) return alert("No tasks to export.");
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "landscape" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const centerX = pageWidth / 2;

    // Page 1: Cover
    doc.setFontSize(30);
    doc.text("User Task Report", centerX, 60, { align: "center" });
    doc.setFontSize(18);
    doc.text(`User: ${username}`, centerX, 85, { align: "center" });
    doc.addPage();

    // Page 2: Summary Table
    const total = tasks.length;
    const completed = tasks.filter(t => t.Status?.toLowerCase() === "complete").length;
    const pending = total - completed;

    const totalWorkHours = tasks.reduce((sum, task) => {
      const hours = parseFloat(task["TotalWorkHours"] || task["Total Work Hours"]);
      return sum + (isNaN(hours) ? 0 : hours);
    }, 0);

    const summaryTableBody = [
      ["Total Tasks", total],
      ["Completed Tasks", completed],
      ["Pending Tasks", pending],
      ["Total Work Hours", totalWorkHours.toFixed(2)]
    ];

    doc.setFontSize(20);
    doc.text("Summary Report", centerX, 20, { align: "center" });
    doc.autoTable({
      startY: 30,
      head: [["Metric", "Value"]],
      body: summaryTableBody,
      styles: { fontSize: 14 },
      headStyles: { fillColor: [22, 160, 133], fontStyle: 'bold' },
      margin: { left: 60, right: 60 }
    });
    doc.addPage();

    // Page 3: Charts (4 charts side by side or 2x2 grid)
    // Create a hidden container to hold canvases
    const container = document.createElement("div");
    container.style.position = "fixed";
    container.style.left = "-10000px";
    container.style.top = "-10000px";
    document.body.appendChild(container);

    // Chart 1: Completed vs Pending tasks
    const c1 = document.createElement("canvas");
    c1.width = 400;
    c1.height = 250;
    container.appendChild(c1);

    // Chart 2: Task Quantities by TYPE OF WORK
    const typeWorkCounts = {};
    tasks.forEach(t => {
      const key = t["TYPE OF WORK"] || "Unknown";
      typeWorkCounts[key] = (typeWorkCounts[key] || 0) + 1;
    });
    const c2 = document.createElement("canvas");
    c2.width = 400;
    c2.height = 250;
    container.appendChild(c2);

    // Chart 3: Total Work Hours over Due Dates (group by date)
    const workHoursByDate = {};
    tasks.forEach(t => {
      const dateStr = formatDate(t["Due date"]);
      const hours = parseFloat(t["TotalWorkHours"] || t["Total Work Hours"]) || 0;
      workHoursByDate[dateStr] = (workHoursByDate[dateStr] || 0) + hours;
    });
    const c3 = document.createElement("canvas");
    c3.width = 400;
    c3.height = 250;
    container.appendChild(c3);

    // Chart 4: Tasks Assigned By different users
    const assignedByCounts = {};
    tasks.forEach(t => {
      const ab = t["Assigned By"] || "Unknown";
      assignedByCounts[ab] = (assignedByCounts[ab] || 0) + 1;
    });
    const c4 = document.createElement("canvas");
    c4.width = 400;
    c4.height = 250;
    container.appendChild(c4);

    const chart1 = new Chart(c1.getContext("2d"), {
      type: "bar",
      data: {
        labels: ["Completed", "Pending"],
        datasets: [{
          label: "Task Status",
          data: [completed, pending],
          backgroundColor: ["#2a9d8f", "#e76f51"]
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        responsive: false,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    const chart2 = new Chart(c2.getContext("2d"), {
      type: "pie",
      data: {
        labels: Object.keys(typeWorkCounts),
        datasets: [{
          data: Object.values(typeWorkCounts),
          backgroundColor: [
            "#264653", "#2a9d8f", "#e9c46a", "#f4a261", "#e76f51", "#6a994e", "#bc6c25"
          ]
        }]
      },
      options: {
        plugins: { legend: { position: "right" } },
        responsive: false
      }
    });

    const chart3 = new Chart(c3.getContext("2d"), {
      type: "line",
      data: {
        labels: Object.keys(workHoursByDate).sort(),
        datasets: [{
          label: "Total Work Hours by Due Date",
          data: Object.keys(workHoursByDate).sort().map(d => workHoursByDate[d]),
          borderColor: "#2a9d8f",
          backgroundColor: "#2a9d8f33",
          fill: true,
          tension: 0.3,
        }]
      },
      options: {
        plugins: { legend: { display: true } },
        responsive: false,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    const chart4 = new Chart(c4.getContext("2d"), {
      type: "bar",
      data: {
        labels: Object.keys(assignedByCounts),
        datasets: [{
          label: "Tasks Assigned By",
          data: Object.values(assignedByCounts),
          backgroundColor: "#e76f51"
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        responsive: false,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    // Wait a moment to render charts (Chart.js is sync but canvas image needs paint)
    await new Promise(r => setTimeout(r, 1000));

    // Add each chart image on PDF page 3 in grid layout
    const chartWidth = 90;
    const chartHeight = 60;
    const marginX = 20;
    const marginY = 20;
    const startX = 20;
    const startY = 40;

    const charts = [chart1, chart2, chart3, chart4];
    const canvases = [c1, c2, c3, c4];

    for (let i = 0; i < charts.length; i++) {
      const imgData = canvases[i].toDataURL("image/png");
      const x = startX + (i % 2) * (chartWidth + marginX);
      const y = startY + Math.floor(i / 2) * (chartHeight + marginY);
      doc.addImage(imgData, "PNG", x, y, chartWidth, chartHeight);
    }

    document.body.removeChild(container);

    doc.addPage();

    // Page 4: Table
    const body = tasks.map((task, i) => [
      i + 1,
      task["Existing Company Name"] || "",
      task["TYPE OF WORK"] || "",
      task["ACCOUNT TYPE"] || "",
      task["Accounts / Cards"] || "",
      task["Task"] || "",
      task["Status"] || "",
      task["Owner"] || "",
      formatDate(task["Due date"]),
      task["Assigned By"] || "",
      task["Time Start"] || task["TimeStarted"] || "",
      task["Time End"] || task["TimeEnd"] || "",
      task["TOTAL OUT OF HOURS"] || task["TotalPauseHours"] || "",
      task["Total Work Hours"] || task["TotalWorkHours"] || "",
      task["Remarks (New)"] || task["Remarks"] || ""
    ]);

    doc.autoTable({
      head: [headers],
      body: body,
      styles: { fontSize: 7 },
      headStyles: { fillColor: [22, 160, 133], fontStyle: 'bold' },
      startY: 20,
      margin: { left: 10, right: 10 },
      pageBreak: 'auto'
    });

    doc.save("user_tasks_report.pdf");
  }

  document.getElementById("downloadCsvBtn").addEventListener("click", () => {
    const filtered = applyFilters();
    downloadCSV(filtered);
  });

  document.getElementById("downloadPdfBtn").addEventListener("click", () => {
    const filtered = applyFilters();
    downloadPDF(filtered);
  });

  document.getElementById("dateFilter").addEventListener("change", (e) => {
    document.getElementById("customDateInputs").classList.toggle("hidden", e.target.value !== "custom");
  });

  window.onload = loadTasks;
</script>
</body>
</html>
