<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Generate Report</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- jsPDF, AutoTable, Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #e0f7fa, #ffffff);
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #16648d;
    }
    button {
      margin: 10px 10px 10px 0;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #2a9d8f;
      color: white;
    }
    button:hover {
      background-color: #21867a;
    }
    .filters {
      margin-bottom: 20px;
    }
    .filters label {
      margin-right: 10px;
    }
    .hidden {
      display: none;
    }
    #loading {
      margin-top: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>

<h1>User Task Report</h1>

<div class="filters">
  <label>
    Date Filter:
    <select id="dateFilter">
      <option value="all">All</option>
      <option value="thisMonth">This Month</option>
      <option value="lastMonth">Previous Month</option>
      <option value="custom">Custom Range</option>
    </select>
  </label>

  <span id="customDateInputs" class="hidden">
    <label>From: <input type="date" id="fromDate" /></label>
    <label>To: <input type="date" id="toDate" /></label>
  </span>
</div>

<button onclick="window.location.href='Home.html'">Home</button>
<button id="downloadCsvBtn" disabled>Download CSV</button>
<button id="downloadPdfBtn" disabled>Download PDF</button>

<div id="loading">Loading tasks for user...</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
    authDomain: "task-manager-602da.firebaseapp.com",
    projectId: "task-manager-602da",
    storageBucket: "task-manager-602da.appspot.com",
    messagingSenderId: "438978699329",
    appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const username = sessionStorage.getItem("username") || "";

  const headers = [
    "SINO", "Company Name", "TYPE OF WORK", "ACCOUNT TYPE", "Accounts / Cards", 
    "Task", "Status", "Owner", "Due date", "Assigned By", 
    "Time Started", "Time End", "Total Pause Hours", "Total Work Hours", "Remarks"
  ];

  let allTasks = [];

  async function loadTasks() {
    if (!username) {
      document.getElementById('loading').textContent = 'User not logged in.';
      return;
    }

    try {
      const snapshot = await db.collection('tasks').where("Owner", "==", username).get();
      allTasks = [];

      snapshot.forEach(doc => {
        const data = { id: doc.id, ...doc.data() };
        data["Due date"] = data["Due date"]?.seconds 
          ? new Date(data["Due date"].seconds * 1000)
          : new Date(data["Due date"]);
        allTasks.push(data);
      });

      document.getElementById('loading').textContent = `Loaded ${allTasks.length} tasks for ${username}.`;
      document.getElementById('downloadCsvBtn').disabled = false;
      document.getElementById('downloadPdfBtn').disabled = false;
    } catch (err) {
      console.error(err);
      document.getElementById('loading').textContent = 'Error loading tasks.';
    }
  }

  function isWithinRange(date, start, end) {
    return date instanceof Date && !isNaN(date) && date >= start && date <= end;
  }

  function applyFilters() {
    const filter = document.getElementById('dateFilter').value;
    const fromDate = document.getElementById('fromDate').value;
    const toDate = document.getElementById('toDate').value;
    const now = new Date();
    let filtered = [...allTasks];

    if (filter === 'thisMonth') {
      const start = new Date(now.getFullYear(), now.getMonth(), 1);
      const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      filtered = filtered.filter(task => isWithinRange(task["Due date"], start, end));
    } else if (filter === 'lastMonth') {
      const start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const end = new Date(now.getFullYear(), now.getMonth(), 0);
      filtered = filtered.filter(task => isWithinRange(task["Due date"], start, end));
    } else if (filter === 'custom' && fromDate && toDate) {
      const start = new Date(fromDate);
      const end = new Date(toDate);
      filtered = filtered.filter(task => isWithinRange(task["Due date"], start, end));
    }

    return filtered;
  }

  function escapeCSV(value) {
    if (!value) return "";
    const val = String(value);
    if (val.includes(",") || val.includes('"') || val.includes("\n")) {
      return `"${val.replace(/"/g, '""')}"`;
    }
    return val;
  }

  function formatDate(date) {
    return date instanceof Date ? date.toISOString().split("T")[0] : date || "";
  }

  function downloadCSV(tasks) {
    if (tasks.length === 0) return alert("No tasks to export.");
    const csvRows = [headers.join(",")];
    tasks.forEach((task, i) => {
      const row = [
        i + 1,
        escapeCSV(task["Existing Company Name"]),
        escapeCSV(task["TYPE OF WORK"]),
        escapeCSV(task["ACCOUNT TYPE"]),
        escapeCSV(task["Accounts / Cards"]),
        escapeCSV(task["Task"]),
        escapeCSV(task["Status"]),
        escapeCSV(task["Owner"]),
        formatDate(task["Due date"]),
        escapeCSV(task["Assigned By"]),
        escapeCSV(task["TimeStarted"] || task["Time Start"]),
        escapeCSV(task["TimeEnd"] || task["Time End"]),
        escapeCSV(task["TotalPauseHours"] || task["TOTAL OUT OF HOURS"]),
        escapeCSV(task["TotalWorkHours"] || task["Total Work Hours"]),
        escapeCSV(task["Remarks"] || task["Remarks (New)"])
      ];
      csvRows.push(row.join(","));
    });
    const blob = new Blob([csvRows.join("\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "user_tasks_report.csv";
    a.click();
  }

  async function downloadPDF(tasks) {
    if (tasks.length === 0) return alert("No tasks to export.");
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "landscape" });
    const centerX = doc.internal.pageSize.getWidth() / 2;

    // Page 1: Cover
    doc.setFontSize(30);
    doc.text("User Task Report", centerX, 60, { align: "center" });
    doc.setFontSize(18);
    doc.text(`User: ${username}`, centerX, 85, { align: "center" });
    doc.addPage();

    // Page 2: Summary
    const total = tasks.length;
    const completed = tasks.filter(t => t.Status?.toLowerCase() === "complete").length;
    const pending = total - completed;

    const totalWorkHours = tasks.reduce((sum, task) => {
      const hours = parseFloat(task["TotalWorkHours"] || task["Total Work Hours"]);
      return sum + (isNaN(hours) ? 0 : hours);
    }, 0);

    doc.setFontSize(20);
    doc.text("Summary Report", centerX, 20, { align: "center" });
    doc.setFontSize(14);
    doc.text(`Total Tasks: ${total}`, 20, 40);
    doc.text(`Completed Tasks: ${completed}`, 20, 50);
    doc.text(`Pending Tasks: ${pending}`, 20, 60);
    doc.text(`Total Work Hours: ${totalWorkHours.toFixed(2)}`, 20, 70);
    doc.addPage();

    // Page 3: Charts
    const canvas = document.createElement("canvas");
    canvas.width = 800;
    canvas.height = 300;
    document.body.appendChild(canvas);

    new Chart(canvas.getContext("2d"), {
      type: "bar",
      data: {
        labels: ["Completed", "Pending"],
        datasets: [{
          label: "Task Status",
          data: [completed, pending],
          backgroundColor: ["#2a9d8f", "#e76f51"]
        }]
      }
    });

    await new Promise(r => setTimeout(r, 1000)); // wait chart render
    const imgData = canvas.toDataURL("image/png");
    doc.addImage(imgData, "PNG", 30, 40, 240, 120);
    document.body.removeChild(canvas);
    doc.addPage();

    // Page 4: Table
    const body = tasks.map((task, i) => [
      i + 1,
      task["Existing Company Name"] || "",
      task["TYPE OF WORK"] || "",
      task["ACCOUNT TYPE"] || "",
      task["Accounts / Cards"] || "",
      task["Task"] || "",
      task["Status"] || "",
      task["Owner"] || "",
      formatDate(task["Due date"]),
      task["Assigned By"] || "",
      task["Time Start"] || task["TimeStarted"] || "",
      task["Time End"] || task["TimeEnd"] || "",
      task["TOTAL OUT OF HOURS"] || task["TotalPauseHours"] || "",
      task["Total Work Hours"] || task["TotalWorkHours"] || "",
      task["Remarks (New)"] || task["Remarks"] || ""
    ]);

    doc.autoTable({
      head: [headers],
      body: body,
      styles: { fontSize: 7 },
      headStyles: { fillColor: [22, 160, 133], fontStyle: 'bold' },
      startY: 20,
      margin: { left: 10, right: 10 },
    });

    doc.save("user_tasks_report.pdf");
  }

  document.getElementById("downloadCsvBtn").addEventListener("click", () => {
    const filtered = applyFilters();
    downloadCSV(filtered);
  });

  document.getElementById("downloadPdfBtn").addEventListener("click", () => {
    const filtered = applyFilters();
    downloadPDF(filtered);
  });

  document.getElementById("dateFilter").addEventListener("change", (e) => {
    document.getElementById("customDateInputs").classList.toggle("hidden", e.target.value !== "custom");
  });

  window.onload = loadTasks;
</script>
</body>
</html>
