<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sub Admin Dashboard – Task Manager</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fff; /* Clean white background */
      margin: 0;
      padding: 0 20px 40px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
      color: #222;
    }

    header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 2px solid #16a085;
      font-weight: 600;
      color: #16a085;
      user-select: none;
    }

    .left-label {
      font-size: 1.2rem;
    }

    .center-datetime {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .profile-container {
      position: relative;
      cursor: pointer;
    }

    .profile-name {
      color: #16a085;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 12px;
      background: #d1f0eb;
      transition: background 0.3s;
    }

    .profile-name:hover {
      background: #b0e4d8;
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 110%;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 8px 16px rgba(22, 160, 133, 0.25);
      width: 120px;
      z-index: 10;
    }

    .dropdown.show {
      display: block;
    }

    .dropdown button {
      width: 100%;
      padding: 10px;
      border: none;
      background: none;
      font-weight: 600;
      color: #16a085;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .dropdown button:hover {
      background: #ec4545;
      color: white;
    }

    main {
      display: flex;
      gap: 24px;
      margin-top: 20px;
    }

    .sidebar {
      width: 180px;
      background-color: #f9f9f9; /* lighter gray for cleaner look */
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(22, 160, 133, 0.15);
      padding: 20px;
      font-weight: 600;
      color: #16a085;
      user-select: none;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar .menu-item {
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
      text-decoration: none;
      display: block;
      color: #16a085;
    }

    .sidebar .menu-item:hover,
    .sidebar .menu-item.active {
      background-color: #1abc9c;
      color: white;
      text-decoration: none;
    }

    .main-content {
      display: flex;
      gap: 24px;
      flex-grow: 1;
    }

    .left-panel {
      flex: 1;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(22, 160, 133, 0.15);
      padding: 20px;
      min-height: 400px;
    }

    .right-panel {
      flex: 1;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(22, 160, 133, 0.15);
      padding: 20px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <header>
    <div class="left-label">Sub Admin</div>
    <div class="center-datetime" id="dateTimeDisplay">Loading...</div>
    <div class="profile-container" id="profileContainer">
      <div class="profile-name" id="profileName">Sub Admin</div>
      <div class="dropdown" id="profileDropdown">
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>

  <main>
    <nav class="sidebar">
      <ul>
        <li class="menu-item active" data-section="tasks">Tasks</li>
        <li class="menu-item" data-section="chart">View in Chart</li>
      </ul>
    </nav>

    <div class="main-content">
      <section class="left-panel" id="leftPanel">
        <!-- Task or Chart content will load here -->
      </section>

      <section class="right-panel" id="rightPanel">
        <!-- Task details or chart info will load here -->
      </section>
    </div>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyD9ymWqihHWbVb4IRop1lXT-huLjBvS50w",
      authDomain: "task-manager-602da.firebaseapp.com",
      projectId: "task-manager-602da",
      storageBucket: "task-manager-602da.appspot.com",
      messagingSenderId: "438978699329",
      appId: "1:438978699329:web:9f475d04352bbdaa5ce6c0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const username = sessionStorage.getItem("username");
    const fullName = sessionStorage.getItem("fullName");

    if (!username) {
      window.location.href = "index.html";
    } else {
      document.getElementById("profileName").textContent = fullName || username;
    }

    const profileContainer = document.getElementById("profileContainer");
    const dropdown = document.getElementById("profileDropdown");

    profileContainer.addEventListener("click", () => {
      dropdown.classList.toggle("show");
    });

    document.addEventListener("click", (e) => {
      if (!profileContainer.contains(e.target)) {
        dropdown.classList.remove("show");
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "index.html";
    });

    const dateTimeDisplay = document.getElementById("dateTimeDisplay");
    function updateDateTime() {
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, {
        weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
      });
      const timeStr = now.toLocaleTimeString(undefined, {
        hour: '2-digit', minute: '2-digit'
      });
      dateTimeDisplay.textContent = `${dateStr} ${timeStr}`;
    }
    updateDateTime();
    setInterval(updateDateTime, 60000);

    // Load Tasks view inside the dashboard
    function loadTasksView() {
      document.getElementById("leftPanel").innerHTML = `
        <h2>Your Tasks</h2>
        <ul id="taskList">
          <li>Task 1: Review reports</li>
          <li>Task 2: Update task manager</li>
          <li>Task 3: Meet with team</li>
        </ul>
      `;
      document.getElementById("rightPanel").innerHTML = `<p>Select a task to view details.</p>`;
    }

    // Load Chart view inside the dashboard
    function loadChartView() {
      document.getElementById("leftPanel").innerHTML = `<h2>View in Chart</h2><p>Analyze tasks visually.</p>`;
      document.getElementById("rightPanel").innerHTML = `<p>Charts or graphs will be shown here.</p>`;
    }

    // Initially load the tasks view on page load
    loadTasksView();

    // Sidebar menu click handlers
    document.querySelectorAll(".menu-item").forEach(item => {
      item.addEventListener("click", () => {
        // Remove active class from all menu items
        document.querySelectorAll(".menu-item").forEach(el => el.classList.remove("active"));
        // Add active class to clicked item
        item.classList.add("active");

        const section = item.getAttribute("data-section");
        if (section === "tasks") {
          loadTasksView();
        } else if (section === "chart") {
          loadChartView();
        }
      });
    });
  </script>
</body>
</html>
